name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        max-jobs = 2
        cores = 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify validated main revision
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify current main identity
        id: main-identity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          printf 'validated_sha=%s\ncurrent_main_sha=%s\n' "$EXPECTED_SHA" "$current_sha"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
            printf 'validated main is current\n'
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            printf 'stale workflow: current main is %s, validated SHA is %s\n' "$current_sha" "$EXPECTED_SHA"
          fi
      - name: Run Release Please
        id: release
        if: steps.main-identity.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - name: Find pending Release PR
        id: release-pr
        if: steps.main-identity.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --json number,headRefName,headRepository,baseRefName,labels,author --jq '[.[] | select(.baseRefName == "main" and .headRepository.nameWithOwner == env.GITHUB_REPOSITORY and .author.login == "github-actions[bot]" and ([.labels[].name] | index("autorelease: pending")) != null)]')"
          count="$(jq length <<< "$prs")"
          test "$count" -le 1
          if [ "$count" = 1 ]; then
            number="$(jq -r '.[0].number' <<< "$prs")"
            branch="$(jq -r '.[0].headRefName' <<< "$prs")"
            printf 'found=true\nnumber=%s\nbranch=%s\n' "$number" "$branch" >> "$GITHUB_OUTPUT"
          else
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify pending Release PR identity
        if: steps.main-identity.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq '.base.sha')"
          test -n "$current_sha"
          test -n "$base_sha"
          printf 'validated_sha=%s\ncurrent_main_sha=%s\nrelease_pr_base_sha=%s\n' "$EXPECTED_SHA" "$current_sha" "$base_sha"
          test "$current_sha" = "$EXPECTED_SHA"
          test "$base_sha" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.main-identity.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        if: steps.main-identity.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
      - name: Write release context
        if: steps.main-identity.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test "$current_sha" = "$EXPECTED_SHA"
          pyyaml_store="$(nix build --no-link --print-out-paths nixpkgs#python3Packages.pyyaml)"
          pyyaml_site="$(find "$pyyaml_store/lib" -type d -name site-packages -print -quit)"
          test -n "$pyyaml_site"
          PYTHONPATH="$pyyaml_site" nix shell nixpkgs#python3 -c python3 scripts/release-context --write
          PYTHONPATH="$pyyaml_site" nix shell nixpkgs#python3 -c python3 scripts/release-context --check
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          test "$(git diff --name-only)" = "CHANGELOG.md"
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test "$current_sha" = "$EXPECTED_SHA"
          git config user.name "release-please[bot]"
          git config user.email "49699333+release-please[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): add compatibility context"
          git push origin "HEAD:${{ steps.release-pr.outputs.branch }}"
