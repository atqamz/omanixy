name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: |
        max-jobs = 2
        cores = 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: trusted-main
          persist-credentials: false
      - name: Verify validated main revision
        working-directory: trusted-main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - name: Find merged Release PR
        id: merged-pr
        working-directory: trusted-main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          pending_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label "autorelease: pending" --limit 200 --json number)"
          pending_count="$(jq length <<< "$pending_prs")"
          test "$pending_count" -le 1
          if [ "$pending_count" = 0 ]; then
            printf 'found=false\nrelease_commit=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_pr_number="$(jq -r '.[0].number' <<< "$pending_prs")"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$release_pr_number")"
          release_sha="$(jq -r '.merge_commit_sha' <<< "$pr_json")"
          test -n "$release_sha"
          test "$(jq -r '.base.ref' <<< "$pr_json")" = main
          test "$(jq -r '.base.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.merged_at' <<< "$pr_json")" != null
          test "$(jq -r '.user.login' <<< "$pr_json")" = "github-actions[bot]"
          pending="$(jq '[.labels[].name | select(. == "autorelease: pending")] | length == 1' <<< "$pr_json")"
          test "$pending" = true
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_sha/pulls")"
          matches="$(jq --arg sha "$release_sha" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)]' <<< "$prs")"
          test "$(jq length <<< "$matches")" = "1"
          test "$(jq -r '.[0].number' <<< "$matches")" = "$release_pr_number"
          parent_count="$(git rev-list --parents -n 1 "$release_sha" | awk '{print NF - 1}')"
          test "$parent_count" = 1
          actual_release_files="$(git diff --name-only "$release_sha^1" "$release_sha" | LC_ALL=C sort)"
          expected_release_files="$(printf '%s\n' .release-please-manifest.json CHANGELOG.md version.txt | LC_ALL=C sort)"
          test "$actual_release_files" = "$expected_release_files"
          for path in .release-please-manifest.json CHANGELOG.md version.txt; do
            tree_entry="$(git ls-tree "$release_sha" -- "$path")"
            test "$(awk '{print $1}' <<< "$tree_entry")" = 100644
            test "$(awk '{print $2}' <<< "$tree_entry")" = blob
          done
          version="$(git show "$release_sha:version.txt")"
          expected_title="chore(main): release $version"
          title="$(jq -r '.title' <<< "$pr_json")"
          test "$title" = "$expected_title"
          release_commit=false
          if git merge-base --is-ancestor "$release_sha" "$VALIDATED_SHA"; then
            release_commit=true
          else
            printf 'release candidate %s is not covered by validated main %s\n' "$release_sha" "$VALIDATED_SHA"
          fi
          printf 'found=true\nnumber=%s\nrelease_sha=%s\nrelease_commit=%s\npending=%s\n' "$release_pr_number" "$release_sha" "$release_commit" "$pending" >> "$GITHUB_OUTPUT"
      - name: Verify release candidate ancestry
        id: main-identity
        working-directory: trusted-main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          RELEASE_COMMIT: ${{ steps.merged-pr.outputs.release_commit }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          printf 'validated_sha=%s\nrelease_sha=%s\ncurrent_main_sha=%s\n' "$VALIDATED_SHA" "$RELEASE_SHA" "$current_sha"
          current=false
          if [ "$current_sha" = "$VALIDATED_SHA" ]; then
            current=true
            printf 'validated main is current\n'
          else
            printf 'stale workflow: current main is %s, validated SHA is %s\n' "$current_sha" "$VALIDATED_SHA"
          fi
          release_eligible=false
          if [ "$RELEASE_COMMIT" = true ]; then
            git fetch --no-tags origin "$current_sha"
            git merge-base --is-ancestor "$RELEASE_SHA" "$current_sha"
            release_eligible=true
          fi
          printf 'current=%s\nrelease_eligible=%s\n' "$current" "$release_eligible" >> "$GITHUB_OUTPUT"
      - name: Check out validated release commit
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
        run: |
          set -eu -o pipefail
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Inspect merged release state
        id: release-state
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          version="$(cat version.txt)"
          tag="v$version"
          expected_notes="$(python3 scripts/release-context --release-notes)"
          if tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            test "$(jq -r '.object.type' <<< "$tag_json")" = commit
            test "$(jq -r '.object.sha' <<< "$tag_json")" = "$RELEASE_SHA"
          fi
          if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            target="$(jq -r '.target_commitish' <<< "$release_json")"
            name="$(jq -r '.name' <<< "$release_json")"
            body="$(jq -r '.body' <<< "$release_json")"
            draft="$(jq -r '.draft' <<< "$release_json")"
            prerelease="$(jq -r '.prerelease' <<< "$release_json")"
            tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            test "$target" = "$RELEASE_SHA"
            test "$tag_target" = "$RELEASE_SHA"
            test "$name" = "$tag"
            test "$body" = "$expected_notes"
            test "$draft" = false
            test "$prerelease" = false
            printf 'exists=true\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exclusive publish candidate
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true' && steps.merged-pr.outputs.pending == 'true'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          RELEASE_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          git fetch --no-tags origin "$current_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "$current_sha"
          pending_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label "autorelease: pending" --limit 200 --json number)"
          test "$(jq length <<< "$pending_prs")" = 1
          test "$(jq -r '.[0].number' <<< "$pending_prs")" = "$RELEASE_PR_NUMBER"
      - name: Canonicalize merged Release PR body
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true' && steps.merged-pr.outputs.pending == 'true' && steps.release-state.outputs.exists != 'true'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          git fetch --no-tags origin "$current_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "$current_sha"
          version="$(cat version.txt)"
          expected_title="chore(main): release $version"
          current_title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq '.title')"
          test "$current_title" = "$expected_title"
          expected_body="$(python3 scripts/release-context --render-pr-body)"
          jq -n --arg body "$expected_body" '{body: $body}' |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --input - >/dev/null
          actual_body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq '.body')"
          test "$actual_body" = "$expected_body"
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          git fetch --no-tags origin "$current_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "$current_sha"
      - name: Verify publish preconditions
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true' && steps.merged-pr.outputs.pending == 'true' && steps.release-state.outputs.exists != 'true'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          RELEASE_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          git fetch --no-tags origin "$current_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "$current_sha"
          version="$(cat version.txt)"
          expected_title="chore(main): release $version"
          expected_body="$(python3 scripts/release-context --render-pr-body)"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          test "$(jq -r '.merged_at' <<< "$pr_json")" != null
          test "$(jq -r '.merge_commit_sha' <<< "$pr_json")" = "$RELEASE_SHA"
          test "$(jq -r '.user.login' <<< "$pr_json")" = "github-actions[bot]"
          test "$(jq -r '.title' <<< "$pr_json")" = "$expected_title"
          test "$(jq -r '.body' <<< "$pr_json")" = "$expected_body"
          test "$(jq '[.labels[].name | select(. == "autorelease: pending")] | length' <<< "$pr_json")" = 1
          test "$(jq '[.labels[].name | select(. == "autorelease: tagged")] | length' <<< "$pr_json")" = 0
          pending_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label "autorelease: pending" --limit 200 --json number)"
          test "$(jq length <<< "$pending_prs")" = 1
          test "$(jq -r '.[0].number' <<< "$pending_prs")" = "$RELEASE_PR_NUMBER"
      - name: Publish merged Release PR
        id: publish
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true' && steps.merged-pr.outputs.pending == 'true' && steps.release-state.outputs.exists != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true
      - name: Verify published release identity
        if: steps.publish.outcome == 'success'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          RELEASE_CREATED: ${{ steps.publish.outputs.release_created }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.publish.outputs.body }}
          RELEASE_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          version="$(cat version.txt)"
          tag="v$version"
          expected_notes="$(python3 scripts/release-context --release-notes)"
          test "$RELEASE_CREATED" = true
          test "$PUBLISHED_SHA" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "$tag"
          test "$RELEASE_BODY" = "$expected_notes"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r '.target_commitish' <<< "$release_json")" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$RELEASE_SHA"
          test "$(jq -r '.name' <<< "$release_json")" = "$tag"
          test "$(jq -r '.body' <<< "$release_json")" = "$expected_notes"
          test "$(jq -r '.draft' <<< "$release_json")" = false
          test "$(jq -r '.prerelease' <<< "$release_json")" = false
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          test "$(jq '[.labels[].name | select(. == "autorelease: pending")] | length' <<< "$pr_json")" = 0
          test "$(jq '[.labels[].name | select(. == "autorelease: tagged")] | length' <<< "$pr_json")" = 1
      - name: Reconcile exact existing release labels
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true' && steps.merged-pr.outputs.pending == 'true' && steps.release-state.outputs.exists == 'true'
        working-directory: trusted-main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
        run: |
          gh pr edit "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
      - name: Verify tagged release identity
        if: steps.merged-pr.outputs.release_commit == 'true' && steps.main-identity.outputs.release_eligible == 'true' && steps.release-state.outputs.exists == 'true'
        working-directory: trusted-main
        env:
          RELEASE_SHA: ${{ steps.merged-pr.outputs.release_sha }}
          RELEASE_PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          tag="v$(cat version.txt)"
          expected_notes="$(python3 scripts/release-context --release-notes)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r '.target_commitish' <<< "$release_json")" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$RELEASE_SHA"
          test "$(jq -r '.name' <<< "$release_json")" = "$tag"
          test "$(jq -r '.body' <<< "$release_json")" = "$expected_notes"
          test "$(jq -r '.draft' <<< "$release_json")" = false
          test "$(jq -r '.prerelease' <<< "$release_json")" = false
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          test "$(jq '[.labels[].name | select(. == "autorelease: pending")] | length' <<< "$pr_json")" = 0
          test "$(jq '[.labels[].name | select(. == "autorelease: tagged")] | length' <<< "$pr_json")" = 1
      - name: Recheck current main for maintenance
        id: maintenance-main
        if: steps.main-identity.outputs.current == 'true'
        working-directory: trusted-main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test -n "$current_sha"
          if [ "$current_sha" = "$VALIDATED_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Maintain Release PR
        id: maintain
        if: steps.maintenance-main.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
      - name: Find pending Release PR
        id: release-pr
        if: steps.maintenance-main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --label "autorelease: pending" --limit 100 --json number,headRefName,headRepository,baseRefName,labels,author)"
          prs="$(jq --arg repo "$GITHUB_REPOSITORY" '
            def normalized_author:
              if . == "github-actions[bot]" or . == "app/github-actions"
              then "github-actions:bot"
              else .
              end;
            [.[] | select(.baseRefName == "main" and .headRepository.nameWithOwner == $repo and ((.author.login | normalized_author) == "github-actions:bot") and ([.labels[].name] | index("autorelease: pending")) != null)]
          ' <<< "$raw_prs")"
          count="$(jq length <<< "$prs")"
          test "$count" -le 1
          if [ "$count" = 1 ]; then
            number="$(jq -r '.[0].number' <<< "$prs")"
            branch="$(jq -r '.[0].headRefName' <<< "$prs")"
            printf 'found=true\nnumber=%s\nbranch=%s\n' "$number" "$branch" >> "$GITHUB_OUTPUT"
          else
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify pending Release PR identity
        id: candidate-identity
        if: steps.maintenance-main.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        working-directory: trusted-main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -eu -o pipefail
          current_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          base_sha="$(jq -r '.base.sha' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"
          pending="$(jq '[.labels[].name | select(. == "autorelease: pending")] | length == 1' <<< "$pr_json")"
          test -n "$current_sha"
          test -n "$base_sha"
          test -n "$head_sha"
          test "$current_sha" = "$VALIDATED_SHA"
          test "$base_sha" = "$VALIDATED_SHA"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_ref" = "$RELEASE_BRANCH"
          test "$author" = "github-actions[bot]"
          test "$pending" = true
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.maintenance-main.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        with:
          ref: ${{ steps.candidate-identity.outputs.head_sha }}
          fetch-depth: 0
          path: release-pr
          persist-credentials: false
      - name: Verify Release PR file boundary
        if: steps.maintenance-main.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        working-directory: release-pr
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          set -eu -o pipefail
          actual_release_files="$(git diff --name-only "$VALIDATED_SHA...HEAD" | LC_ALL=C sort)"
          expected_release_files="$(printf '%s\n' .release-please-manifest.json CHANGELOG.md version.txt | LC_ALL=C sort)"
          test "$actual_release_files" = "$expected_release_files"
          for path in .release-please-manifest.json CHANGELOG.md version.txt; do
            tree_entry="$(git ls-tree HEAD -- "$path")"
            test "$(awk '{print $1}' <<< "$tree_entry")" = 100644
            test "$(awk '{print $2}' <<< "$tree_entry")" = blob
          done
          expected_title="chore(main): release $(cat version.txt)"
          actual_title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq '.title')"
          test "$actual_title" = "$expected_title"
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11
        if: steps.maintenance-main.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        with:
          github-token: ""
      - name: Write release context
        if: steps.maintenance-main.outputs.current == 'true' && steps.release-pr.outputs.found == 'true'
        working-directory: release-pr
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_ROOT: ${{ github.workspace }}/trusted-main
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          wait_for_pr_head() {
            attempt=1
            while [ "$attempt" -le 10 ]; do
              pr_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq '.head.sha')"
              printf 'candidate_sha=%s pr_head_sha=%s attempt=%s\n' "$candidate_sha" "$pr_head_sha" "$attempt"
              if [ "$pr_head_sha" = "$candidate_sha" ]; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 1
            done
            return 1
          }
          current_sha="$(git -C "$TRUSTED_ROOT" ls-remote --refs origin refs/heads/main | cut -f1)"
          test "$current_sha" = "$VALIDATED_SHA"
          pyyaml_store="$(nix build --inputs-from "$TRUSTED_ROOT" --no-link --print-out-paths nixpkgs#python3Packages.pyyaml)"
          pyyaml_site="$(find "$pyyaml_store/lib" -type d -name site-packages -print -quit)"
          test -n "$pyyaml_site"
          PYTHONPATH="$pyyaml_site" nix shell --inputs-from "$TRUSTED_ROOT" nixpkgs#python3 -c python3 "$TRUSTED_ROOT/scripts/release-context" --write
          if ! git diff --quiet -- CHANGELOG.md; then
            test "$(git diff --name-only)" = "CHANGELOG.md"
            current_sha="$(git -C "$TRUSTED_ROOT" ls-remote --refs origin refs/heads/main | cut -f1)"
            test "$current_sha" = "$VALIDATED_SHA"
            candidate_sha="$(git rev-parse HEAD)"
            remote_candidate_sha="$(git ls-remote --refs origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
            printf 'candidate_sha=%s remote_candidate_sha=%s\n' "$candidate_sha" "$remote_candidate_sha"
            test "$remote_candidate_sha" = "$candidate_sha"
            git config user.name "release-please[bot]"
            git config user.email "49699333+release-please[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): add compatibility context"
            gh auth setup-git
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          current_sha="$(git -C "$TRUSTED_ROOT" ls-remote --refs origin refs/heads/main | cut -f1)"
          test "$current_sha" = "$VALIDATED_SHA"
          candidate_sha="$(git rev-parse HEAD)"
          remote_candidate_sha="$(git ls-remote --refs origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          printf 'candidate_sha=%s remote_candidate_sha=%s\n' "$candidate_sha" "$remote_candidate_sha"
          test "$remote_candidate_sha" = "$candidate_sha"
          wait_for_pr_head
          test "$pr_head_sha" = "$candidate_sha"
          expected_body="$(python3 "$TRUSTED_ROOT/scripts/release-context" --render-pr-body)"
          jq -n --arg body "$expected_body" '{body: $body}' |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --input - >/dev/null
          actual_body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq '.body')"
          test "$actual_body" = "$expected_body"
          wait_for_pr_head
          test "$pr_head_sha" = "$candidate_sha"
          PYTHONPATH="$pyyaml_site" nix shell --inputs-from "$TRUSTED_ROOT" nixpkgs#python3 -c python3 "$TRUSTED_ROOT/scripts/release-context" --check
