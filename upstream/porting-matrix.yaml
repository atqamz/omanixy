          consumption: runtime
        - path: shell/plugins/panels/wifiqr/Panel.qml
          role: QR matrix consumer
          consumption: runtime
        - path: bin/omarchy-network-qr
          role: reference contract
          consumption: audited-reference
    requirement: Read the active non-enterprise NetworkManager connection, emit the metadata plus QR matrix consumed by the Quattro share panel, and reveal its password only on explicit user action.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host NetworkManager
