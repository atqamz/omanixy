      - omarchy-capture-screenshot
    tests:
      - test/quattro-contract-audit.sh
      - test/safe-menu-contract.sh
    notes:
      - The compatibility root supplies a deterministic safe menu instead of the distro-specific upstream default.
      - User extension menus remain user-owned and are not claimed as supported Omanixy defaults.

