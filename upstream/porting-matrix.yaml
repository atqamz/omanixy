items:
  - id: shell.runtime
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/shell.qml
          role: runtime entrypoint
          consumption: runtime
        - path: shell/
          role: runtime shell tree and first-party plugin discovery
          consumption: runtime
        - path: config/omarchy/shell.json
          role: upstream default shell configuration
          consumption: runtime-fallback-and-migration
        - path: themes/tokyo-night/
          role: Tokyo Night source for the baseline theme seed
          consumption: build-time
        - path: bin/omarchy-launch-shell
          role: upstream reference only
          consumption: reference-only
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host session
    dependencies:
      runtime:
        - quickshell
      host:
        - Wayland
        - Hyprland
        - D-Bus user session
    tests:
      - test/config-ownership.sh
      - test/ipc-wrapper.sh
      - test/runtime-closure.sh
      - test/service-unit.sh
      - test/pin-invariants.sh
    notes:
      - Systemd owns restart, logging, and graphical-session lifecycle.
      - The upstream Bash supervisor is not copied.

  - id: shell.ipc
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/shell.qml
          role: IpcHandler targets and plugin routing
          consumption: runtime
        - path: shell/README.md
          role: documented IPC contract
          consumption: reference
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: Quickshell IPC
    dependencies:
      runtime:
        - quickshell
      host:
        - Wayland
        - XDG_RUNTIME_DIR
    tests:
      - test/ipc-wrapper.sh
    notes:
      - The omanixy-shell client is a narrow compatibility entry point for Quattro IPC calls.
      - It never starts or supervises the shell.

  - id: bar.workspaces
    classification: exact
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/bar/
          role: Quattro bar presentation
          consumption: runtime
        - path: shell/plugins/panels/workspaces/
          role: workspace presentation
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Hyprland
    requirement: Workspaces expose Hyprland state and focus actions.
    ownership:
      presentation: omarchy
      adapter: none
      backend: host Hyprland
    dependencies:
      host:
        - Hyprland
    tests:
      - test/runtime-closure.sh
    notes:
      - Workspace state and focus remain native Quickshell and Hyprland contracts.

  - id: launcher.apps
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/services/AppLibrary.qml
          role: desktop entry discovery, launch, and removal
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - DesktopEntries
    requirement: Discover desktop entries, launch them through the session, and remove user-owned launcher entries.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host desktop entries
    dependencies:
      runtime:
        - gtk3
      host:
        - user desktop entry database
    helper: omarchy-remove-launcher-entry
    tests:
      - test/compat-adapters.sh
      - test/safe-menu-contract.sh
    notes:
      - Launching uses a narrow uwsm-app and gtk-launch compatibility path.
      - Removal rejects missing entries and does not implement package removal.

  - id: menu.baseline
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/menu/Menu.qml
          role: menu presentation and command execution
          consumption: runtime
        - path: default/omarchy/omarchy-menu.jsonc
          role: upstream menu data reference
          consumption: audited-reference
    requirement: Every actionable row in the Omanixy baseline resolves to a native capability or audited adapter.
    ownership:
      presentation: omarchy
      adapter: omanixy compatibility root
      backend: host session
    dependencies:
      runtime:
        - systemd
      host:
        - user session
    helper:
      - omarchy-shell
      - omarchy-capture-screenshot
    tests:
      - test/quattro-contract-audit.sh
      - test/safe-menu-contract.sh
    notes:
      - The compatibility root supplies a deterministic safe menu instead of the distro-specific upstream default.
      - User extension menus remain user-owned and are not claimed as supported Omanixy defaults.

  - id: tray
    classification: exact
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/bar/widgets/Tray.qml
          role: system tray presentation
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.SystemTray
    requirement: Render and operate StatusNotifier tray items through Quickshell.
    ownership:
      presentation: omarchy
      adapter: none
      backend: host StatusNotifier services
    dependencies:
      host:
        - D-Bus session bus
        - StatusNotifier items
    tests:
      - test/runtime-closure.sh
    notes:
      - Omanixy does not start a second tray daemon.

  - id: media.mpris
    classification: exact
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/services/media/Service.qml
          role: MPRIS state and playback actions
          consumption: runtime
        - path: shell/plugins/services/media/manifest.json
          role: service registration
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Mpris
        - Quickshell.Services.Pipewire
    requirement: Select an MPRIS player and perform the actions exposed by the Quattro media service.
    ownership:
      presentation: omarchy
      adapter: none
      backend: host MPRIS and PipeWire
    dependencies:
      host:
        - D-Bus session bus
        - MPRIS players
        - PipeWire
    tests:
      - test/runtime-closure.sh
    notes:
      - The media plugin is enabled in the new-install baseline because its reachable behavior is native.

  - id: audio.native-state
    classification: exact
    maturity: validated
    upstream:
