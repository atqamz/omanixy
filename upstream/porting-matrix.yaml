  - id: notification.client
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/weather/BarWidget.qml
          role: weather right-click notification client
          consumption: runtime
        - path: bin/omarchy-notification-send
          role: pinned notification client contract
          consumption: audited-reference
    requirement: Send supported weather and pinned notification-client requests through the host notification client.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host notification service
    dependencies:
      runtime:
        - libnotify
      host:
        - notification daemon
    helper: omarchy-notification-send
    tests:
      - test/compat-adapters.sh
    notes:
