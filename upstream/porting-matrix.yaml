  - id: network.status-band-dns
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/network/Panel.qml
          role: status, band, and DNS helper consumers
          consumption: runtime
        - path: default/omarchy/omarchy-menu.jsonc
          role: DNS menu reference
          consumption: audited-reference
    requirement: Provide bounded NetworkManager and iw queries plus connection-scoped DNS selection without writing NixOS-owned files.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host NetworkManager
    dependencies:
      runtime:
        - iproute2
        - iw
        - jq
        - networkmanager
      host:
        - NetworkManager
    helper:
      - omarchy-network-status
      - omarchy-network-band
      - omarchy-dns
    tests:
      - test/compat-adapters.sh
    notes:
      - DNS adaptation uses nmcli connection properties and never writes /etc/NetworkManager or systemd-resolved configuration.
      - The upstream Custom DNS pill is hidden in the compatibility view because its terminal launcher depends on an omitted Omarchy presentation wrapper; DHCP, Cloudflare, and Google remain supported.
      - Enterprise Wi-Fi rows are omitted from the compatibility view because the pinned enterprise profile mutation is outside the audited password contract.
      - Omanixy does not start a second NetworkManager instance.

  - id: network.qr
    classification: adapted
    maturity: validated
    upstream:
