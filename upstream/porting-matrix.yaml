      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/audio/Panel.qml
          role: PipeWire and MPRIS state presentation
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Pipewire
        - Quickshell.Services.Mpris
    requirement: Show and control the native PipeWire state already represented by the panel.
    ownership:
      presentation: omarchy
      adapter: none
      backend: host PipeWire and WirePlumber
    dependencies:
      host:
        - PipeWire
        - WirePlumber
        - D-Bus session bus
    tests:
      - test/runtime-closure.sh

  - id: audio.default-device
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/audio/Panel.qml
          role: default sink and source actions
          consumption: runtime
    requirement: Change the selected PipeWire default sink or source and report available sinks.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host PipeWire and WirePlumber
    dependencies:
      runtime:
        - pipewire
      host:
        - PipeWire
        - WirePlumber
    helper:
      - omarchy-audio-output-set-default
      - omarchy-audio-input-set-default
      - omarchy-audio-output-sink
      - omarchy-audio-sink-availability
    tests:
      - test/compat-adapters.sh
    notes:
      - Default selection uses wpctl; node names and sink availability come from pw-dump metadata.
      - Stream movement, tuning, and EasyEffects-specific behavior is omitted because the supported panel does not require it.

  - id: network.native
    classification: exact
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/network/Panel.qml
          role: NetworkManager-backed Wi-Fi presentation
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Networking
    requirement: Discover NetworkManager devices and Wi-Fi networks through the native Quickshell model.
    ownership:
      presentation: omarchy
      adapter: none
      backend: host NetworkManager
    dependencies:
      host:
        - NetworkManager
        - D-Bus system bus
    tests:
      - test/runtime-closure.sh
    notes:
      - Omanixy does not enable or start NetworkManager.

  - id: network.status-band-dns
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/network/Panel.qml
          role: status, band, and DNS helper consumers
          consumption: runtime
        - path: default/omarchy/omarchy-menu.jsonc
          role: DNS menu reference
          consumption: audited-reference
    requirement: Provide bounded NetworkManager and iw queries plus connection-scoped DNS selection without writing NixOS-owned files.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host NetworkManager
    dependencies:
      runtime:
        - iproute2
        - iw
        - jq
        - networkmanager
      host:
        - NetworkManager
    helper:
      - omarchy-network-status
      - omarchy-network-band
      - omarchy-dns
    tests:
      - test/compat-adapters.sh
    notes:
      - DNS adaptation uses nmcli connection properties and never writes /etc/NetworkManager or systemd-resolved configuration.
      - Omanixy does not start a second NetworkManager instance.

  - id: network.qr
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/network/Panel.qml
          role: network panel QR action
          consumption: runtime
        - path: shell/plugins/panels/wifiqr/Panel.qml
          role: QR matrix consumer
          consumption: runtime
        - path: bin/omarchy-network-qr
          role: reference contract
          consumption: audited-reference
    requirement: Read the active non-enterprise NetworkManager connection and emit the metadata plus QR matrix consumed by the Quattro share panel.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host NetworkManager
    dependencies:
      runtime:
        - networkmanager
        - qrencode
      host:
        - NetworkManager
    helper: omarchy-network-qr
    tests:
      - test/compat-adapters.sh
    notes:
      - Credentials are read through nmcli stdout and never passed as process arguments.
      - Enterprise Wi-Fi sharing is rejected rather than emitting an unusable password QR.

  - id: network.speedtest
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/network/Panel.qml
          role: speed-test action
          consumption: runtime
        - path: shell/plugins/panels/speedtest/Panel.qml
          role: speed-test result consumer
          consumption: runtime
        - path: bin/omarchy-network-speedtest
          role: reference contract
          consumption: audited-reference
    requirement: Measure one bounded download or upload phase and emit numeric Mbps samples for the Quattro overlay.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host network
    dependencies:
      runtime:
        - curl
        - iproute2
        - jq
      host:
        - active network interface
    helper: omarchy-network-speedtest
    tests:
      - test/compat-adapters.sh
    notes:
      - Each phase is bounded to five seconds and endpoint discovery is bounded to four seconds.
      - The adapter does not install or own a network service.

