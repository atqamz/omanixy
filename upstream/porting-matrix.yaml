  - id: audio.default-device
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/audio/Panel.qml
          role: default sink and source actions
          consumption: runtime
    requirement: Change the selected PipeWire default sink or source and report available sinks.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host PipeWire and WirePlumber
    dependencies:
      runtime:
        - pipewire
        - wireplumber
      host:
        - PipeWire
        - WirePlumber
    helper:
      - omarchy-audio-output-set-default
      - omarchy-audio-input-set-default
      - omarchy-audio-output-sink
      - omarchy-audio-sink-availability
    tests:
      - test/compat-adapters.sh
    notes:
      - Default selection uses wpctl; node names and sink availability come from pw-dump metadata.
      - Defaults are also updated through pactl and active application streams are moved, excluding EasyEffects filter-chain streams as pinned upstream does.
      - Output sink resolution follows EasyEffects/DSP virtual sinks to the physical sink used for effective loudness.
      - The pinned helper makes backend mutations best-effort and returns status 1 for invalid arguments; Omanixy intentionally validates metadata, hard-fails backend errors, rolls back partial changes, and returns status 2 for invalid arguments.

