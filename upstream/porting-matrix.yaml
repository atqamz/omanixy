    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 7/8
    promoted_at_layer: 7/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/notifications/
          role: freedesktop notification daemon, popup presentation, DND, and bounded local history/popup persistence - only optional org.freedesktop.Notifications ownership, popup lifecycle, DND, and bounded history/popup persistence are ported; the omarchy-exec hint's persisted exec role and its Util.execDetached execution, the compositor-focus fallback, and every bash -c/-lc file-state job are all deliberately not ported (see notes)
          consumption: audited-reference
        - path: bin/omarchy-hyprland-focus-app
          role: notification action focus helper, deliberately not ported - FDO notification ownership does not require notification-driven compositor focus mutation; a click with no live default action simply dismisses the toast
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Notifications
    requirement: Keep notification-send as a client capability and make daemon ownership a separate explicit opt-in.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: consumer D-Bus session and notification service policy - Layer 7 owns no system capability, only a session D-Bus name claim
      session: consumer or external daemon by default; explicitly selected pinned Quickshell NotificationServer, owned by the same Quattro shell process, when programs.omanixy.security.notifications.daemon.enable is true
    helpers:
      - omanixy-notification-state
      - omarchy-notification-send
    filesystem:
      - ~/.local/state/omarchy/notifications.json
      - ~/.local/state/omarchy/notifications/
      - ~/.local/state/omarchy/notifications/history/
      - ~/.local/state/omarchy/notifications/images/
    dbus_services:
      - org.freedesktop.Notifications
    failure_sensitive:
      - replacement IDs must update the tracked notification object, never create a duplicate live row
      - DND, actions, history, popup state, and images persist according to the selected owner
      - shell restart must not silently claim an existing daemon name, and must never kill or replace a known or unknown external owner
      - a restored (cross-restart) popup row must never resolve to a live action, even under old-generation id reuse by a fresh notification
      - the historical omarchy-exec hint, or any other arbitrary command/argument carried in notification hints, must never become executable state or a shell invocation
      - a state-persistence Process that fails to start must advance the popup-file job queue exactly once, never deadlocking later notifications
    evidence:
      available:
        - declarative programs.omanixy.security.notifications.daemon.enable Home Manager option, disabled by default, structurally independent of programs.omanixy.security.lock(.fingerprint)/polkit.agent/idle.enable and of programs.omanixy.features = [ "notification" ] in both directions, with known-conflict assertions against services.mako.enable/services.dunst.enable/services.swaync.enable/services.fnott.enable and no NixOS pairing required at all (pure session D-Bus ownership)
        - exact-source, fail-on-drift patcher (scripts/patch-notification-service) removing the pinned omarchy-exec hint's persisted exec role and its Util.execDetached execution, the focusApp/focusAppProc compositor-focus fallback, and every bash -c/-lc file-state job, replacing the latter with direct-argv calls to the narrow, fixed-domain omanixy-notification-state helper, proven against the real pinned source
        - a narrow, fixed-domain omanixy-notification-state compatibility helper (packages/omanixy-shell/adapters/notification-state.bash) owning HOME/stem validation, bounded (<=5 MiB) image copying with no caller-controlled destination, and history trimming to 10 entries internally - no eval, no bash -c, no arbitrary executable name or destination directory
        - fail-closed, provenance-aware executable-surface scan (scripts/scan-notification-executable-surface) proving the adapted Service.qml's only reachable executable is omanixy-notification-state, always invoked with a literal verb from the reviewed fixed-domain set; the queue-plumbing shapes (`command: command`, `popupFileProc.command = job.command`) are accepted only when they fall inside one of the three canonical queue functions (enqueuePopupFileJob/enqueueHistoryRead/runNextPopupFileJob), each required to match pinned text exactly once; every executable enqueue producer is a separately reviewed, pinned canonical producer block (persistPopupFile/deletePopupFileFor/archivePopupFileFor/writeHistoryFile/clearHistory/sweepOrphanImages) whose local literal command construction and enqueuePopupFileJob call are proven together in one lexical producer scope - never a file-global nearest-preceding-construction search, which a hostile review found could be satisfied by a same-named function parameter, an unrelated prior function's literal, or a destructured/aliased local in a wholly different, unreviewed function; a fourteen-case adversarial matrix (test/security-notifications-executable-surface.sh) proves a second copy of either queue shape, an attacker-controlled call argument, a dead literal shadowed by a dynamic reassignment, a duplicated or renamed canonical block, a shadowing function parameter (with and without a dynamic caller), a prior-function-only literal, a destructured shadow, a reviewed-looking producer with an extra reassignment, a parameter-plus-local-ambiguity shape, a duplicated producer block, and every prior comment/string false-positive case, all still fail or pass correctly
        - NotificationLogic.js behavior tests (test/security-notifications-logic.sh), driving the real patched module, proving the exec role is structurally absent from every schema it produces (snapshot, history, popup, replacement) even when fed a hostile omarchy-exec hint, that persistablePopup's copy descriptors carry a role rather than a caller-facing destination path, and that history trimming/malformed-line skipping and DND-bypass/ephemeral classification are unchanged from pinned
        - hermetic omanixy-notification-state adapter test (test/security-notifications-state.sh) covering HOME/stem/arity validation, every verb's success and not-found paths, the 10-entry history limit, clear-history never touching live popups, a torn/missing directory degrading to bounded failure, image-copy bounds (oversized rejected, FIFO source never blocks, traversal/escape structurally impossible since the destination is always derived internally), an explicit 64 KiB serialized-payload bound proven at limit-1/limit/limit+1/well-above-limit (kept clear of Linux's own separate 128 KiB MAX_ARG_STRLEN, so the adapter's bound - not the kernel's - is what is proven to reject an oversized payload), and transactional validation proving a later invalid or duplicate-role pair in the same call leaves zero new artifacts (no orphaned image from an earlier valid pair, no JSON artifact) for both persist-popup and persist-history
        - hermetic offscreen Quickshell behavior proof (test/security-notifications-qml-behavior.sh) driving the real generated Service.qml (with only the popup PanelWindow and the native NotificationServer test-doubled, exactly as the spec permits) through the complete lettered matrix: ordinary popup creation (A); DND suppression that actually reaches real history through the real queue/helper, not a popup-count assertion alone (B); replacement preserving live identity with no duplicate live or persisted row (C); DND persistence hydrated back by a second real instance of the same generated service against the same HOME (D); dismiss (E) and expiration (F) both archiving into real history, driven through the same functions the real UI calls rather than a wall-clock sleep; a live default FDO action invoking exactly once (G) and no live action performing no execution (H); a live hostile omarchy-exec click actually exercised through invokePopupDefault with no execution, no side-effect file, and no exec field surviving (I); a restored/hostile-coincidental-id row never resolving to a live action (J); deterministic newest-<=10 history replay built through the real queue/helper (K); a corrupt/torn persisted line skipped without losing either valid neighbor, driven through the real restorePopups(raw) function (L); and, in a second exact-transform harness that fakes only the three Process objects' signal/state surface while calling the unmodified real finishPopupFileJob/reconcile*FailedToStart/runNextPopupFileJob production functions, FailedToStart handling for all three Processes (M), ordering-independent exactly-once completion under both the pinned and a hostile-reversed runningChanged/exited ordering (N), and a 100-job synthetic FailedToStart stress run proving the queue always drains to zero with no autonomous retry or runaway loop (O)
        - static ABI contract evidence against the pinned Quickshell NotificationServer source (server.cpp/server.hpp/qml.cpp) that registration targets exactly /org/freedesktop/Notifications and org.freedesktop.Notifications, that a registration conflict is a bounded, one-shot diagnostic with no replace/kill/terminate vocabulary anywhere in the file, that retry is driven purely by the serviceUnregistered signal with no timer/loop construct in the registration path, that replacesId reuses the existing idMap object, and that keepOnReload is immutable once the server has been started
        - shell.json and managed-plugin ownership proofs mirroring the Layer-3/5/6 lock/polkit/idle model exactly, including the reserved omarchy.notifications namespace never being revivable via a hand-edited shell.json or a third-party plugin shadowing it
        - core-vs-core+notification-daemon closure proof at raw store-path granularity: declaredRuntimeInputs is exact-equal (the daemon adds no package of its own), the compat-bin entry set gains exactly one helper (omanixy-notification-state), and after excluding the exact, named set of Omanixy-owned derivations expected to change identity, every remaining external dependency store path is byte-identical
        - client/daemon closure independence proof: the notification-send client feature alone never packages the daemon plugin tree, the daemon alone never packages the notify-send client helper, and selecting both together yields exactly their union
        - lower-layer independence proof: enabling the daemon alongside every other experimental security capability (lock, fingerprint, polkit, idle) changes nothing about their own generated source byte content
        - layer 8 live evidence (test/security-recovery-notifications-vm.nix, upstream/security-recovery-matrix.yaml) of real org.freedesktop.Notifications ownership and delivery on a real session bus, a real replacement/default-action/close round trip, real DND behavior with persistence hydrated back after a restart, a real unknown-owner runtime collision left non-destructive with event-driven reclaim once the other owner releases the name, and a bounded finite notification burst
        - layer 8 live evidence (test/security-recovery-notifications-vm.nix, recovery.notifications-session-bus-lifecycle) that destroying this test user's real login session and D-Bus user-session bus (systemctl stop on the owning transient unit, confirmed by the user manager reaching SubState=dead, not simulated by sleeping) and then establishing a genuinely fresh session lets a fresh daemon instance claim org.freedesktop.Notifications and deliver again - the specifically-notification-daemon-scoped half of session D-Bus disappearance/recovery, distinct from the systemd-service-level restart bound proven for the shell as a whole (see security.recovery)
        - final layer 8 remediation live evidence (test/security-recovery-notifications-vm.nix, recovery.notifications-known-daemon-collision) of a real collision with a known, by-name external daemon - a real, pinned dunst 1.13.2 process under a disposable Xvfb X11 display - genuinely owning org.freedesktop.Notifications before the Quattro daemon starts, with the Quattro harness never stealing the name, both processes alive throughout, only the test itself terminating dunst, an event-driven reclaim with no restart, and delivery working again afterward
      required_before_supported:
        - "a real collision with the remaining named daemons (mako/swaync/fnott actually running) - unattempted at this layer: they are wlr-layer-shell-only and still depend on the same live Wayland compositor connection this environment's nested-compositor investigation already found unavailable, unlike dunst's X11 backend which let that one real by-name daemon already be exercised live (see the evidence above) - recorded as unsupported-environment in upstream/security-recovery-matrix.yaml (recovery.notifications-named-daemon-breadth)"
        - monitor hotplug with popups visible on screen (recovery.notifications-monitor-hotplug) - depends on the same live nested-compositor presentation security.lock's own nested-compositor investigation could not establish
    tests:
      - test/quattro-contract-audit.sh
      - test/security-contracts.sh
      - test/security-recovery-contract.sh
      - test/security-recovery-notifications-vm.nix
      - test/security-notifications-hm.sh
      - test/security-notifications-shell-json.sh
      - test/security-notifications-managed-plugin.sh
      - test/security-notifications-logic.sh
      - test/security-notifications-state.sh
      - test/security-notifications-executable-surface.sh
      - test/security-notifications-closure.sh
      - test/security-notifications-client-independence.sh
      - test/security-notifications-lower-layer-independence.sh
      - test/security-notifications-quickshell-contract.sh
      - test/security-notifications-qml-behavior.sh
    notes:
      - This entry is distinct from notification.client, which remains an adapted client contract and does not supervise a notification daemon.
      - The client presentation feature (programs.omanixy.features = [ "notification" ]) and this daemon-ownership option are independent axes in both directions; neither enables, requires, or implies the other.
      - The historical omarchy-exec hint and the compositor-focus fallback are intentionally, permanently unsupported in the native daemon - this is a hard security boundary, not deferred follow-up work.

  - id: security.recovery
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 8/8
    promoted_at_layer: 8/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/lock/Service.qml
          role: stranded-lock and authentication failure recovery
          consumption: audited-reference
        - path: shell/plugins/polkit/PolkitAgent.qml
          role: registration and authentication failure recovery
          consumption: audited-reference
        - path: shell/plugins/services/idle/Service.qml
          role: idle and screensaver recovery
          consumption: audited-reference
        - path: shell/plugins/notifications/Service.qml
          role: notification persistence and restart recovery
          consumption: audited-reference
    requirement: Promote security surfaces only after the complete failure and recovery matrix passes.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: NixOS and consumer host policy
      session: explicitly selected Omanixy owner only
    evidence:
      available:
        - pinned failure-sensitive behavior inventory
        - separate compatibility and support-state ledger
        - a durable, machine-checked recovery evidence matrix (upstream/security-recovery-matrix.yaml), cross-validated against this ledger by test/security-recovery-contract.sh, recording every case this layer attempted, its environment, and whether it passed, was environment-unsupported, or remains required-before-supported
        - real PAM conversation and repeated-failure evidence against a live pam_unix backend in a booted NixOS VM (test/security-recovery-pam-vm.nix), including a distinct missing-service failure mode and a real bounded systemd restart under a genuine Wayland-absent failure condition for omanixy-shell.service
        - real polkit agent registration, authentication, cancellation, runtime collision, and daemon-disappearance/recovery evidence against a live polkitd in a booted NixOS VM (test/security-recovery-polkit-vm.nix)
        - real org.freedesktop.Notifications ownership, delivery, replacement/action/close, DND persistence, non-destructive runtime collision, and bounded-burst evidence against a live session bus in a booted NixOS VM (test/security-recovery-notifications-vm.nix)
        - a cross-feature boot and crash-recovery proof with PAM, polkit, and the notification daemon all selected together in one booted NixOS VM (test/security-recovery-cross-feature-vm.nix)
        - an investigated, documented environment limitation for every case requiring a live nested Wayland compositor (native lock's WlSessionLock, idle's IdleMonitor, polkit's PanelWindow presentation, and suspend/resume while any of these is active): two independent topologies were attempted and both fail for genuinely distinct reasons - the pinned Hyprland 0.55.4/Aquamarine headless backend does not reach a usable compositor state in this KVM/QEMU host even with a DRM render node present, and a second attempt nesting the same pinned Hyprland inside a test-owned headless Weston (Aquamarine's Wayland backend, confirmed to exist and genuinely attempted at this pin) fails on a real Wayland protocol-version mismatch (Aquamarine hard-binds wl_compositor version 6, Weston 15.0.1 advertises only version 5) - both recorded as unsupported-environment rather than skipped or faked (upstream/security-recovery-matrix.yaml)
        - a hostile self-review of this layer's diff confirming no security option defaulted true, no new recovery daemon or public option, no pam_faillock, no pam_systemd_home, no automatic pre-suspend lock ownership, no broad sudo/setuid, and no competing agent/daemon killed
      required_before_supported:
        - suspend and resume while a native lock or idle cycle is active (recovery.suspend-resume) - live nested-compositor evidence for the native lock and idle surfaces themselves is owned by security.lock's and security.idle's own required_before_supported entries, not duplicated here
        - real laptop lid hardware validation - Omanixy does not own lid/clamshell policy and none is introduced here; recorded in upstream/security-recovery-matrix.yaml (recovery.lid-hardware)
    tests:
      - test/security-contracts.sh
      - test/security-recovery-contract.sh
      - test/security-recovery-pam-vm.nix
      - test/security-recovery-polkit-vm.nix
      - test/security-recovery-notifications-vm.nix
      - test/security-recovery-cross-feature-vm.nix
    notes:
      - This is the final promotion gate, not a permission to enable any security runtime by default. Every programs.omanixy.security.* option remains default false after this layer.
      - Enrolled physical fingerprint hardware and a real TOD driver remain outstanding; that gap is owned entirely by security.pam-fingerprint's own required_before_supported entries (recovery.pam-fingerprint-enrolled-hardware, recovery.pam-fingerprint-tod-driver) and is not duplicated here, per the same child-surface-owns-its-own-gap discipline this entry's suspend/resume bullet already follows.
      - security.recovery is a compatibility/support ledger entry, not a user-selectable runtime capability; there is no programs.omanixy.security.recovery option, no new recovery daemon, dispatcher, or supervisor. All recovery behavior remains owned by the already-selected services and the existing omanixy-shell.service lifecycle.
      - pam_faillock is intentionally omitted from the v0.1 lock password policy; layer 8's real repeated-wrong-password evidence is the proof this decision holds under load, not a TODO to revisit.
      - systemd-homed accounts (pam_systemd_home) remain unimplemented and unclaimed; the v0.1 backend is ordinary shadow-backed Unix accounts via pam_unix only.
      - Omanixy does not own system suspend/sleep policy: no omarchy-system-sleep-monitor, omarchy-sleep-lock.service, systemd-inhibit listener, or automatic pre-suspend lock owner is introduced by this or any layer; that policy remains with NixOS/consumer configuration by design, not by omission.
      - Third-party QML plugins execute unsandboxed inside the same shell process as every security-sensitive surface; this is documented, not hidden, and is one reason every native security integration remains experimental rather than supported.
      - No security.* entry reaches support: supported after this layer. The target for every entry, including this one, remains adapted/experimental.
