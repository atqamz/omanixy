    requirement: Copy a selected emoji to the Wayland clipboard and synthesize the supported paste action.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host Wayland clipboard
    dependencies:
      runtime:
        - wl-clipboard
        - wtype
      host:
        - Wayland
    helper: omarchy-menu-emoji-insert
    tests:
      - test/compat-adapters.sh

  - id: weather
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/weather/
          role: weather state, location, and forecast consumers
          consumption: runtime
    requirement: Preserve the weather location state shape and provide bounded wttr.in weather queries.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: user state and public weather endpoint
    dependencies:
      runtime:
        - curl
        - jq
      optional:
        - network access to wttr.in
      host: []
    helper:
      - omarchy-weather-location
      - omarchy-weather-status
      - omarchy-notification-send
    tests:
      - test/compat-adapters.sh
    notes:
      - Missing or malformed location state fails safely and does not invent credentials.
      - Notification sending is a client call to the host notification service, not daemon ownership.

  - id: notification.client
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
