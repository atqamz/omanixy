      - omarchy-network-password
    tests:
      - test/compat-adapters.sh
    notes:
      - Credentials are read through nmcli stdout and never passed as process arguments.
      - Enterprise Wi-Fi sharing is rejected rather than emitting an unusable password QR.
      - Password output is a private stdout contract for the wifiqr panel and is never exposed in menu output or process arguments.

