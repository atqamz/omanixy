  - id: monitor.display
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/monitor/Panel.qml
          role: monitor state, brightness, scaling, and text-size consumers
          consumption: runtime
    requirement: Preserve the monitor panel's internal display state and bounded Hyprland and brightness actions.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host Hyprland and brightness device
    dependencies:
      runtime:
        - brightnessctl
        - jq
      host:
        - Hyprland
        - kernel backlight or display brightness device
    helper:
      - omarchy-monitor-state
      - omarchy-brightness-display
      - omarchy-hyprland-monitor-scaling
      - omarchy-display-text-size
    tests:
      - test/compat-adapters.sh
    notes:
      - Scaling captures and preserves the current width, height, and refresh rate instead of selecting a synthetic preferred mode.
      - Text-size changes update the Quattro base size, GTK text scaling, and supported terminal font settings atomically where those backends exist.
      - The adapter also preserves the pinned up/down monitor-scaling forms and cleans fractional requests against the current mode dimensions.
      - DDC and hardware-specific external-display behavior is not claimed by the brightness adapter.
      - The pinned text-size helper makes selected gsettings mutations best-effort and returns status 1 for invalid arguments; Omanixy intentionally hard-fails unavailable backends, rolls back partial mutations, and returns status 2 for invalid arguments.

