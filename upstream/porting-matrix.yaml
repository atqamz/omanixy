  - id: security.lock
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 3/8
    promoted_at_layer: 3/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/lock/
          role: native Quattro lock and recovery behavior
          consumption: audited-reference
        - path: shell/plugins/lock/Service.qml
          role: WlSessionLock, PAM, fingerprint, IPC, and recovery contract
          consumption: audited-reference
        - path: shell/plugins/lock/LockView.qml
          role: password and fingerprint presentation contract
          consumption: audited-reference
        - path: shell/plugins/lock/manifest.json
          role: keep-loaded plugin reachability contract
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Pam
        - Quickshell.Wayland
    requirement: Preserve the pinned session-lock, screen, recovery, and IPC contracts without enabling a native lock in this layer.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: NixOS and consumer host session policy
      session: consumer or external lock provider by default
    dependencies:
      system:
        - declarative PAM service files
      host:
        - Wayland session lock protocol
        - Hyprland monitor state
        - display DPMS
    helpers:
      - omarchy-shell
      - omarchy-hyprland-session-locked
    filesystem:
      - /etc/pam.d/omarchy-lock-password
      - ~/.local/state/omarchy/current/background
    pam:
      password_service: omarchy-lock-password
      fingerprint_service: omarchy-lock-fingerprint
      interface: Quickshell PamContext calls pam_authenticate only
    services:
      - ext-session-lock Wayland protocol
    failure_sensitive:
      - pending lock remains unresolved while no real screen exists
      - session lock may outlive the shell process and require stranded-lock recovery
      - password failures have a visible count but no local throttle
      - fingerprint failures retry every 250 ms in the pinned source
    evidence:
      available:
        - pinned static source audit
        - Quickshell PAM and WlSessionLock API audit
        - hermetic runtime reachability assertions
        - declarative programs.omanixy.security.lock.enable Home Manager option, disabled by default, structurally separate from programs.omanixy.features
        - hermetic osConfig-based PASS/FAIL assertion matrix proving the HM-to-NixOS PAM handshake fails closed for standalone Home Manager and for integrated PAM-disabled configurations, and passes only when PAM is enabled
        - hermetic proof the fingerprint enrollment probe, its PAM conversation, and its retry loop are removed from the patched Service.qml, with fingerprintConfigured forced false
        - hermetic proof the stranded-lock helper is invoked as direct argv rather than through bash -c
        - hermetic proof wake and blank are bounded, timeout-wrapped Hyprland DPMS dispatches, not the keyboard-backlight or system-wake helpers
        - hermetic proof the lock source tree is packaged only when the security capability is enabled, and never mutates the user-owned shell.json
        - hermetic proof a Nix-managed-enabled security plugin overrides an attempted user disable in PluginRegistry.qml with a deterministic error, while leaving the override list empty when the capability is off
        - fail-closed scan of the patched Service.qml's Process.command executable surface (declarative and procedural, single-line and multiline, comment-immune) against an explicit allowlist, with adversarial fixtures proving unknown executables, dynamic executable/duration positions, non-array dynamic bindings, and bash -c shapes are all rejected
        - hermetic proof the real PluginRegistry.qml scan-and-merge algorithm rejects a hostile third-party plugin shadowing the reserved omarchy.lock id, driven against real first-party and third-party fixture directories rather than a hand-rolled stand-in for the scan
        - hermetic proof security.lock adds zero new declared runtime package inputs and zero new package names to a core-only build, at both the explicit Nix-level dependency declaration and the built closure
        - layer 8 live evidence (test/security-recovery-pam-vm.nix, upstream/security-recovery-matrix.yaml) that the underlying pam_unix conversation this lock depends on - start, prompt, cancel, repeated wrong password, correct password, missing service - is sound against a real PAM stack in a booted VM, and that the owning omanixy-shell.service's restart policy is genuinely bounded under a real failure condition; the lock's own WlSessionLock-bound presentation remains unexercised live, per required_before_supported below
      required_before_supported:
        - crash and restart with an ext-session-lock held against a live nested compositor - investigated at layer 8 and recorded as unsupported-environment in upstream/security-recovery-matrix.yaml (recovery.lock-nested-compositor); the pinned Hyprland 0.55.4/Aquamarine headless backend does not reach a usable compositor state in this KVM/QEMU environment even with a DRM render node present
        - stranded lock detection and recovery against that same live nested compositor (recovery.lock-nested-compositor)
        - no-screen and monitor-change behavior against that same live nested compositor (recovery.lock-nested-compositor)
        - bounded authentication failure behavior exercised through the native lock's own WlSessionLock UI and failedAttempts counter, as opposed to the underlying pam_unix conversation itself, which layer 8 did prove live via a direct PamContext harness (see security.pam-password) - also blocked by the same live nested compositor (recovery.lock-nested-compositor)
    tests:
      - test/quattro-contract-audit.sh
      - test/security-contracts.sh
      - test/security-lock.sh
      - test/security-lock-shell-json.sh
      - test/security-lock-executable-surface.sh
      - test/security-lock-managed-plugin.sh
      - test/security-lock-core-only.sh
    notes:
      - The initial native topology is in-process because it preserves the pinned service and recovery model; it remains experimental because third-party QML shares the process trust boundary.
      - The nested-compositor investigation (recovery.lock-nested-compositor) is the sole live-environment blocker for every remaining native-lock-presentation gap - stranded-lock recovery, no-screen/monitor-change behavior, and WlSessionLock-UI-driven authentication-failure behavior all reduce to that one recorded limitation, not four independent gaps. A broader compositor/GPU/hardware matrix beyond the nested/reference environment attempted at layer 8 remains a permanently open-ended breadth statement, not a completable support gate, and is recorded here rather than in required_before_supported for that reason.
      - Omanixy does not enable the lock plugin, install a lock agent, or write PAM configuration in layer 1.
      - Layer 3 makes the native lock reachable only when programs.omanixy.security.lock.enable is explicitly set to true; it remains off by default, password-only (fingerprint stays structurally unreachable), and still owns no keybinding to trigger it. All evidence in this layer is hermetic and fake-backend; no live authentication, generation switch, or real session lock has been exercised.

  - id: security.pam-password
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 2/8
    promoted_at_layer: 2/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: bin/omarchy-apply-lock
          role: pinned Arch PAM policy intent
          consumption: audited-reference
        - path: shell/plugins/lock/
          role: Quickshell password PAM consumer
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Pam
    nixpkgs:
      revision: 241313f4e8e508cb9b13278c2b0fa25b9ca27163
      paths:
        - nixos/modules/security/pam.nix
    requirement: Provide a dedicated declarative auth-only PAM service for the lock consumer without inheriting unrelated login policy.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: NixOS declarative PAM policy
      session: Omanixy lock consumer when explicitly enabled
    dependencies:
      host:
        - PAM
    filesystem:
      - /etc/pam.d/omarchy-lock-password
    pam:
      service: omarchy-lock-password
      consumer_abi: pam_start_confdir, pam_authenticate, pam_end through Quickshell PamContext
      source_intentions:
        - pam_faillock preauth, authfail, and authsucc
        - pam_systemd_home
        - pam_unix try_first_pass nullok
        - pam_env
        - account include system-local-login
      rejected_shortcuts:
        - nullok is not acceptable for a screen lock
        - account and session rules are not consumed by this Quickshell ABI
        - generated nixpkgs rules are experimental and ordering-sensitive
        - pam_faillock is not adopted in this layer: a lock-screen lockout policy is a cross-cutting recovery decision owned by the layer 8 failure and recovery matrix, not an implicit side effect of the password capability
        - pam_systemd_home is not adopted: the implemented backend is pam_unix against ordinary shadow-backed local Unix accounts; systemd-homed authentication is out of scope for this layer and not claimed to work, independent of whether systemd-homed happens to be available on a given host
        - pam_permit.so is never used as an authentication-success path
    account_backend:
      implemented: pam_unix against shadow-backed local Unix accounts
      unvalidated: systemd-homed accounts (pam_systemd_home not included; not claimed to authenticate)
    failure_sensitive:
      - PAM start failure must be distinct from authentication failure
      - prompt cancellation must abort the PAM subprocess
      - lockout policy must not be inherited accidentally from a login service
    evidence:
      available:
        - exact Quickshell PamContext source and qmltypes
        - exact nixpkgs security.pam module audit
        - pinned Arch policy inventory without its /etc writes
        - declarative programs.omanixy.security.pam.password.enable NixOS option, disabled by default
        - generated /etc/pam.d/omarchy-lock-password hermetically built and content-checked for a single auth-only pam_unix.so line
        - hermetic proof of no nullok, no pam_permit.so, no account/session/password phase, no fingerprint service, and no polkit side effect
        - static proof of no imperative /etc/pam.d writer outside security.pam.services
        - static proof Home Manager declares no PAM service and the NixOS module reaches into no Home Manager or desktop-session option
        - hermetic build proof that an unrelated normal-priority security.pam.services."omarchy-lock-password".text definition does not concatenate into the Omanixy-owned service text (mkForce ownership), via test/security-pam-composition.sh
        - hermetic build proof that Omanixy owns both the service's enable state and its text atomically (mkForce on both fields): an unrelated normal-priority enable = false does not suppress the service, and an assertion fails config.system.build.toplevel's evaluation closed if a second, equal-priority override (for example another lib.mkForce on text) contests ownership, rather than letting nixpkgs' lines-type concatenation silently compose an altered auth stack, via test/security-pam-capability.sh
        - layer 8 live evidence (test/security-recovery-pam-vm.nix, upstream/security-recovery-matrix.yaml) of a real PAM conversation against the generated omarchy-lock-password service in a booted NixOS VM: PAM start, prompt, cancel, correct-password success, wrong-password failure, at least 20 consecutive wrong-password attempts with no lockout state and bounded log growth, and a distinct PAM-start failure when the service is absent
    tests:
      - test/quattro-contract-audit.sh
      - test/security-pam.sh
      - test/security-pam-composition.sh
      - test/security-pam-capability.sh
      - test/security-recovery-contract.sh
      - test/security-recovery-pam-vm.nix
    notes:
      - This layer implements security.pam.services."omarchy-lock-password".text as a single explicit auth-only pam_unix.so line, and owns both that text and the service's enable state atomically via lib.mkForce; no faillock or nullok policy is included.
      - lib.mkForce alone does not defend against an equal-priority competing definition of text, since nixpkgs' lines merge type concatenates same-priority definitions instead of raising a conflict; this layer adds an assertion verifying the final resolved service still matches the exact Omanixy-owned contract whenever the capability is enabled, so such a conflict fails the build closed instead of silently composing. A consumer who needs different policy for this service must disable programs.omanixy.security.pam.password first; this layer provides no extraConfig or other free-form PAM extension option.
      - The implemented password backend is pam_unix against ordinary shadow-backed local Unix accounts. systemd-homed authentication is not implemented by this layer and is not claimed to work; pam_systemd_home is deliberately absent. A host may have systemd-homed available while a given account is still shadow-backed - this is a support-scope omission, not a host-specific claim.
      - support is experimental, not supported, because no live authentication conversation has been exercised; only the generated declarative artifact is hermetically proven.
      - No PAM consumer, native lock, fingerprint capability, polkit agent, idle manager, or notification daemon is enabled by this layer.
      - No faillock or other lockout policy is adopted in this v0.1; layer 8's real, repeated (>=20 attempts) wrong-password evidence against the live pam_unix backend is the proof this decision holds under load, not an outstanding gate to revisit (see security.recovery's own notes for the same confirmation at the ledger's final promotion gate).

  - id: security.pam-fingerprint
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 4/8
    promoted_at_layer: 4/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: bin/omarchy-apply-lock
          role: pinned fingerprint PAM policy intent
          consumption: audited-reference
        - path: shell/plugins/lock/Service.qml
          role: enrollment probe and fingerprint authentication consumer
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Pam
    requirement: Make fingerprint authentication independently optional and bound its backend failure and retry behavior before promotion.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: NixOS PAM and optional fprintd capability
      session: Omanixy lock only when explicitly selected
    dependencies:
      host:
        - PAM
        - optional fprintd
        - optional enrolled fingerprint
    filesystem:
      - /etc/pam.d/omarchy-lock-fingerprint
    pam:
      service: omarchy-lock-fingerprint
      consumer_abi: pam_start_confdir, pam_authenticate, pam_end through Quickshell PamContext
      source_intention: auth required pam_fprintd.so
    services:
      - fprintd backend as a host capability
    failure_sensitive:
      - missing PAM file or fprintd must remain unavailable rather than fail open
      - the pinned 250 ms retry loop must be replaced by bounded backoff and a stop condition
      - fingerprint fallback must not create passwordless authentication
    evidence:
      available:
        - pinned enrollment probe and fingerprint PAM source audit
        - exact Quickshell PAM subprocess and abort behavior audit
        - declarative programs.omanixy.security.pam.fingerprint.enable NixOS option, disabled by default
        - generated /etc/pam.d/omarchy-lock-fingerprint hermetically built and content-checked for a single auth-only pam_fprintd.so line
        - hermetic proof of no nullok, no pam_permit.so, and no account/session/password phase
        - static proof of no imperative /etc/pam.d writer outside security.pam.services, and that Home Manager and the runtime package declare no PAM service for fingerprint either
        - hermetic build proof of mkForce ownership of both the service's enable state and text atomically, mirroring security.pam-password's composition and capability proofs, via test/security-pam-fingerprint-composition.sh and test/security-pam-fingerprint-capability.sh
        - hermetic proof the capability never sets services.fprintd.enable directly and does not widen the nixpkgs-derived fprintAuth default for login, sudo, su, sshd, or polkit-1, via test/security-pam-fingerprint-widening.sh
        - hermetic proof of a bounded fingerprint attempt budget (finite fingerprintMaxAttempts, a non-repeating retry timer, and a reset tied only to lock acquisition) replacing the pinned unbounded 250 ms retry loop, and that fingerprint failure, error, and exhaustion never call finishUnlock(), touch password failedAttempts, or refill from a password failure, via test/security-lock-fingerprint.sh, which also proves beginLock() itself - not only FingerprintPolicy.js's rules in isolation - resets authentication state, invalidates readiness, and consumes the budget synchronously before queuing the lock and only then deferring a bounded fresh readiness refresh
        - hermetic proof of a narrow, argument-free, current-user-only readiness adapter (omarchy-lock-fingerprint-ready) replacing the pinned bash -c/fprintd-list probe, with a ready/definitely-unavailable/indeterminate exit-code ABI, via the lock executable-surface scan at test/security-lock-fingerprint-executable-surface.sh
        - behavioral proof of that adapter's own exit-code ABI against a fake-binary/PATH-injection harness covering args-supplied, missing-backend, id-lookup-failure, timeout, arbitrary-exit-code, single- and multi-device enrollment, no-enrollment, no-device, and malformed-output cases, and that no raw signal/timeout/missing-backend exit code ever leaks past it, via test/security-lock-fingerprint-ready.sh
        - hermetic proof the fingerprint-disabled build is byte-identical to the frozen layer-3 password-only output, via test/security-lock-fingerprint-closure.sh; the declared-runtime-input set is proven to change by exactly the selected fingerprint package (removed = [], added = exactly that one store path) and the compatibility bin is proven to add exactly one executable (omarchy-lock-fingerprint-ready); the full transitive Nix closure is proven only at reachability granularity - the selected fprintd package is absent when fingerprint is disabled and reachable when enabled, not claimed to differ by an exact path count, since the selected package carries its own transitive closure
        - a seven-scenario Home Manager assertion matrix proving programs.omanixy.security.lock.fingerprint.enable is reachable only on an integrated NixOS + Home Manager installation with both paired programs.omanixy.security.pam.password.enable and programs.omanixy.security.pam.fingerprint.enable true, and fails evaluation with an actionable message otherwise
        - hermetic proof that a custom services.fprintd.package threads through as one identity end to end: the generated PAM service, the three NixOS package-registration lists, and the Home Manager runtime's own declared closure inputs all resolve to that exact store path, with no independently-resolved default pkgs.fprintd pulled in alongside it, via test/security-pam-fingerprint-custom-package.sh
        - hermetic proof that services.fprintd.tod.enable resolves services.fprintd.package to the TOD-aware daemon and mirrors the one FP_TOD_DRIVERS_DIR environment variable upstream's own services.fprintd.enable-gated block would otherwise only set, pointed at the selected driver's real path, via test/security-pam-fingerprint-tod.sh
        - behavioral proof of FingerprintPolicy.js's own state machine, driven directly via Node require() rather than a disconnected reimplementation of its rules: every canStartFingerprint and shouldRetryAfterFailure guard vetoing independently, and a full simulated lock lifecycle (indeterminate probe, capability configuration, in-flight-conversation exclusion, budget exhaustion, password-authentication precedence, mid-conversation capability revocation failing a stale success closed, insecure-session and already-unlocked exclusion), via test/security-lock-fingerprint-behavior.sh
        - stress proof, in the same file, that 100 adversarial start attempts driven through the real canStartFingerprint()/shouldRetryAfterFailure() decision sequence - once resolved as ordinary failures, once resolved through both the onError and onCompleted(Error) paths a single failed conversation drives per the pinned Quickshell PamContext ABI - never produce more than 5 actual starts or 5 final attempts, and never re-permit a retry once exhausted; that a password submission with a fingerprint conversation already in flight and budget remaining allows zero further fingerprint starts across 100 further adversarial cycles, and that a subsequent password failure resumes fingerprint only from the untouched remaining budget, never resetting it, with the lock's total starts still never exceeding 5; and that a fresh beginLock() after a prior lock exhausted its budget with readiness left true resets both attempts and readiness before any probe runs, proving budget reset and readiness reset are two separate, intentional transitions
        - layer 8 live evidence (test/security-recovery-pam-vm.nix, upstream/security-recovery-matrix.yaml) that with fingerprint enabled and no reader present in a booted VM, the fingerprint PAM path fails closed and password authentication remains available
        - final layer 8 remediation live evidence (test/security-recovery-pam-vm.nix, recovery.pam-fingerprint-backend-unavailable, recovery.pam-fingerprint-backend-recovery, recovery.pam-fingerprint-backend-stress) that a real fprintd daemon deliberately made genuinely unavailable (a runtime-only systemd.service.d/ ExecStart-override drop-in, never touching any Omanixy-owned or nixpkgs-owned file) fails fingerprint authentication closed and boundedly, that reversing the same stimulus restores a real, responding, still-zero-device backend, and that a finite 20-cycle repeat of the outage stays bounded with no runaway retry and non-growing log volume, with password authentication available throughout
      required_before_supported:
        - enrolled and unenrolled physical hardware validation - no fingerprint reader is available in this environment; recorded as required-before-supported in upstream/security-recovery-matrix.yaml (recovery.pam-fingerprint-enrolled-hardware), not a blocker for the experimental target
        - validation against a real (non-fixture) TOD driver package once one is available under a license this flake can evaluate hermetically - recorded in upstream/security-recovery-matrix.yaml (recovery.pam-fingerprint-tod-driver)
    tests:
      - test/quattro-contract-audit.sh
      - test/security-pam-fingerprint.sh
      - test/security-recovery-contract.sh
      - test/security-recovery-pam-vm.nix
      - test/security-pam-fingerprint-composition.sh
      - test/security-pam-fingerprint-capability.sh
      - test/security-pam-fingerprint-widening.sh
      - test/security-pam-fingerprint-custom-package.sh
      - test/security-pam-fingerprint-tod.sh
      - test/security-lock-fingerprint.sh
      - test/security-lock-fingerprint-ready.sh
      - test/security-lock-fingerprint-behavior.sh
      - test/security-lock-fingerprint-executable-surface.sh
      - test/security-lock-fingerprint-closure.sh
    notes:
      - Fingerprint is not inferred from the presence of the native lock and is not enabled in layer 1.
      - "Layer 4 implements security.pam.services.\"omarchy-lock-fingerprint\" as a single explicit auth-only pam_fprintd.so line, registering services.fprintd's package/dbus/systemd surface directly without ever setting services.fprintd.enable itself, so no other PAM service's fprintAuth default widens as a side effect. It adds the structurally separate, default-off programs.omanixy.security.lock.fingerprint Home Manager option as a secondary unlock path alongside the already-mandatory password fallback, never a replacement for it."
      - Support remains experimental, not supported, for the same reason as security.pam-password: no live authentication conversation, real fprintd daemon, or enrolled hardware has been exercised, only the generated declarative artifact, the bounded state machine, and the readiness adapter's ABI have been hermetically proven.
      - No polkit agent, idle manager, or notification daemon is enabled by this layer.

  - id: security.polkit-agent
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 5/8
    promoted_at_layer: 5/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/polkit/
          role: Quattro user-session polkit agent
          consumption: audited-reference
        - path: bin/omarchy-hw-laptop-closed
          role: optional lid-state helper, deliberately not ported
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Services.Polkit
    nixpkgs:
      revision: 241313f4e8e508cb9b13278c2b0fa25b9ca27163
      paths:
        - nixos/modules/security/polkit.nix
    requirement: Integrate one explicitly owned user-session polkit agent without duplicating polkitd or taking over an unknown agent.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: NixOS security.polkit owns polkitd, D-Bus/systemd integration, polkit-agent-helper, and the polkit-1 PAM service
      session: consumer, or the Quattro agent explicitly selected via the paired programs.omanixy.security.polkit.system/agent.enable handshake
    filesystem:
      - /etc/pam.d/polkit-1
    pam:
      observed_service: polkit-1
      use: native polkit-1 authentication path only; Omanixy neither declares nor parses this PAM service. Pinned Omarchy additionally reads this file only to infer fingerprint UI policy, which Layer 5 deliberately does not port (see notes).
    dbus_services:
      - org.freedesktop.PolicyKit1
      - /org/omarchy/PolkitAgent
    failure_sensitive:
      - registration conflict must be diagnostic and bounded
      - authentication cancellation and failure must close the flow
      - unknown external agents must not be killed or disabled
      - the adapted presentation is authentication-method-neutral and assumes no particular hardware policy
    evidence:
      available:
        - exact Quickshell PolkitAgent and AuthFlow audit
        - exact NixOS polkit daemon and polkit-1 PAM ownership audit
        - declarative programs.omanixy.security.polkit.system.enable NixOS option, disabled by default, declaring security.polkit.enable with an ordinary assignment plus a resolved-state assertion that fails a stronger external override closed
        - declarative programs.omanixy.security.polkit.agent.enable Home Manager option, disabled by default, structurally independent of programs.omanixy.security.lock and its fingerprint sub-option
        - exact-source, fail-on-drift patcher (scripts/patch-polkit-agent) removing the pinned PAM-file fingerprint inference and laptop-lid presentation policy, proven against adversarial drift fixtures
        - fail-closed executable-surface scan (scripts/scan-polkit-executable-surface) proving the final generated PolkitAgent.qml has zero Process object instantiations, zero command bindings, and zero exec/execDetached/run calls of any shape - not merely no command bindings, since a bare Process object can execute via .exec(...) with no command property at all
        - hermetic offscreen Quickshell behavior proof (test/security-polkit-qml-behavior.sh) covering inactive/waiting/response-required/submit/cancel/failure/success/daemon-cancellation states against a deterministic fake agent
        - static ABI contract evidence against the pinned Quickshell polkit service source (one registration attempt per construction, no retry on registration failure, ordinary failure restarts a fresh session, destruction drains queued requests and cancels the active flow, and unregisters only through the listener helper's own null-checked, self-clearing handle)
        - known declarative agent-conflict assertions (services.hyprpolkitagent.enable, services.polkit-gnome.enable) proven via a 12-case Home Manager x NixOS evaluation matrix
        - shell.json and managed-plugin ownership proofs mirroring the Layer-3 lock model exactly
        - core-only closure proof at raw store-path granularity: declaredRuntimeInputs and the compat-bin entry set are byte-identical, and after excluding the exact, named set of Omanixy-owned derivations expected to change identity because the compatibility root's contents differ, every remaining external dependency store path is byte-identical (not merely same-named)
        - layer 8 live evidence (test/security-recovery-polkit-vm.nix, upstream/security-recovery-matrix.yaml) of real D-Bus polkit agent registration against a live polkitd, real authentication success and wrong-password failure against a test-only policy, real user and daemon-initiated cancellation, real registration collision with an independent agent with neither process killed or stopped, and polkitd disappearance/reappearance mid-request with the requester never hanging
        - layer 8 live evidence (test/security-recovery-cross-feature-vm.nix, recovery.polkit-crash-midauth) of killing the shell process mid-authentication against the real agent while a real pkcheck request is in flight, proving the stranded requester exits boundedly and a fresh process re-registers and authenticates cleanly
        - layer 8 live evidence (test/security-recovery-polkit-vm.nix, recovery.polkit-stress-finite) of a finite 20-cycle real wrong-password stress run with bounded process count and log volume, followed by a fresh correct-password authentication
        - layer 8 live evidence (test/security-recovery-polkit-vm.nix, recovery.polkit-daemon-restart) of polkitd disappearing while a real authentication request is in flight, the stranded requester bounded rather than hung, the same still-running harness reprompting and authenticating cleanly once polkitd returns, and a fresh harness process also registering and authenticating cleanly
      required_before_supported:
        - repeated-backend-failure/log-volume behavior at a larger scale (hundreds of cycles) than the finite 20-cycle stress layer 8 already proved passed - recorded as required-before-supported in upstream/security-recovery-matrix.yaml (recovery.polkit-stress-large-scale)
        - nested session validation against a real Wayland/Hyprland compositor rather than an offscreen QPA platform (the PolkitAgent object itself does not require one; only its PanelWindow presentation does; investigated at layer 8 and recorded as unsupported-environment in upstream/security-recovery-matrix.yaml, recovery.polkit-nested-compositor)
    tests:
      - test/quattro-contract-audit.sh
      - test/security-contracts.sh
      - test/security-recovery-contract.sh
      - test/security-recovery-polkit-vm.nix
      - test/security-polkit-system.sh
      - test/security-polkit-hm.sh
      - test/security-polkit-shell-json.sh
      - test/security-polkit-managed-plugin.sh
      - test/security-polkit-core-only.sh
      - test/security-polkit-closure.sh
      - test/security-polkit-executable-surface.sh
      - test/security-polkit-model.sh
      - test/security-polkit-qml-behavior.sh
      - test/security-polkit-quickshell-contract.sh
      - test/security-polkit-no-fingerprint-widening.sh
    notes:
      - Omanixy does not enable the polkit system capability or the Quattro agent, install a competing agent, or write PAM configuration in layer 1.
      - Layer 5 makes the native Quattro polkit agent reachable only when both programs.omanixy.security.polkit.system.enable (NixOS) and programs.omanixy.security.polkit.agent.enable (Home Manager) are explicitly set to true; both remain off by default and structurally outside programs.omanixy.features.
      - The pinned Omarchy PolkitAgent.qml infers fingerprint availability by parsing /etc/pam.d/polkit-1 and checks a laptop-lid helper before showing a fingerprint-specific presentation; Layer 5 deliberately removes both. The adapted presentation is authentication-method-neutral, driven only by the pinned Quickshell AuthFlow.isResponseRequired signal, and never assumes fingerprint hardware.
      - security.lock and security.polkit-agent are fully independent: enabling one never implies or requires the other, proven directly by the Home Manager assertion matrix.
      - experimental, not supported: layer 8 proved real D-Bus registration, real authentication success/failure, real cancellation, real registration collision, and real polkitd disappearance/recovery against a live backend (test/security-recovery-polkit-vm.nix), but never against a live Wayland/Hyprland session (the PolkitAgent object's own presentation was not exercised live, per required_before_supported), which is why "supported" remains out of reach.
      - No polkit-agent restart loop is added on top of the pinned Quickshell ABI's own ordinary-failure-restarts-a-fresh-session behavior; unknown external agent registration failure remains finite and diagnostic, never resolved by killing or disabling anything.
      - No idle manager or notification daemon is enabled by this layer.

  - id: security.idle
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 6/8
    promoted_at_layer: 6/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/services/idle/
          role: idle detection service (Service.qml/IdleModel.js) - only idle detection, inhibitor-aware idle state, and bounded lock-on-idle orchestration are ported; the terminal screensaver path, pre-suspend locking, and DPMS/wake ownership are all deliberately not ported (see notes)
          consumption: audited-reference
        - path: bin/omarchy-launch-screensaver
          role: screensaver launch contract, deliberately not ported - Layer 6 has no screensaver process/timer/tracking of any kind
          consumption: audited-reference
        - path: bin/omarchy-system-lock
          role: lock action contract, deliberately not ported - the adapted service calls the Layer-3 native lock IPC (`omanixy-shell lock lock`) directly instead
          consumption: audited-reference
        - path: bin/omarchy-system-wake
          role: wake/DPMS action contract, deliberately not ported - Layer 6 never blanks the display, so it has nothing of its own to wake
          consumption: audited-reference
        - path: bin/omarchy-system-sleep-monitor
          role: pre-sleep inhibitor/lock contract, deliberately not ported - Layer 8 confirmed final that Omanixy never owns pre-suspend/sleep-monitor policy, by design, not a pending gate
          consumption: audited-reference
        - path: bin/omarchy-system-sleep-lock
          role: pre-sleep lock contract, deliberately not ported - Layer 8 confirmed final that Omanixy never owns pre-suspend lock policy, by design, not a pending gate
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Wayland (IdleMonitor, backed by ext-idle-notify-v1)
    requirement: Provide bounded user-session idle detection with an explicit owner, respecting Wayland inhibitors, that only ever requests the native lock and never owns suspend, DPMS, or the terminal screensaver.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: consumer host suspend, DPMS/display-blanking, and power policy - Layer 6 owns none of it
      session: "Quickshell IdleMonitor detects idle -> the Layer-6 service decides when to request a lock -> Layer 3's native lock owns WlSessionLock+DPMS -> consumer/NixOS owns suspend/power policy -> Layer 8 owns suspend/resume recovery evidence and investigation, never suspend policy itself"
    helpers:
      - omanixy-idle-state
    filesystem:
      - ~/.local/state/omarchy/indicators/stay-awake
    failure_sensitive:
      - respectInhibitors must default to true and never be disabled
      - lock-on-idle must fail closed (no lock request) without security.lock.enable
      - an unsupported ext-idle-notify-v1 protocol must warn and leave isIdle false, never invent a fallback timer
      - lock retries are bounded to 3 actual Process starts per idle cycle and never repeat indefinitely
      - a terminal lock-unavailable result (missing-pam/failed) must never be retried or reinterpreted as success
      - activity or stay-awake must cancel an in-flight lock-on-idle cycle immediately, with no attempt resuming on its own
      - persisted stay-awake state is revocable: an indeterminate probe result (exit 2, or any Process that fails to start) must disable automatic lock-on-idle immediately and never be inferred as "marker absent"
      - a lock/probe/writer Process that fails to start (no exited() ever fired) must be detected without polling and handled exactly like its corresponding exit-based failure, never silently dropped and never double-counted against a later real exit
      - Process.startDetached() must be unreachable from the final audited source, even against an otherwise-allowlisted argv - it would launch a tracked, bounded invocation completely untracked
      - the configured lock timeout must never exceed the pinned Quickshell backend's own signed 32-bit millisecond-conversion range
    evidence:
      available:
        - declarative programs.omanixy.security.idle.enable Home Manager option, disabled by default, structurally independent of programs.omanixy.security.lock.fingerprint and programs.omanixy.security.polkit.agent, with a resolved-state assertion requiring programs.omanixy.security.lock.enable=true and known-conflict assertions against services.hypridle.enable/services.swayidle.enable
        - pure decision-logic module (packages/omanixy-shell/IdlePolicy.js) for the bounded lock-retry policy, driven directly (not reimplemented) by both the real generated Service.qml and a 100-iteration Node.js stress test covering exhaustion, terminal failures, activity/stay-awake cancellation, and new-cycle budget resets
        - exact-source, fail-on-drift patcher (scripts/patch-idle-service) removing the pinned screensaver/Hyprland/system-lock/system-wake code and hardening the lock-timeout parser (floor-then-positive-check, so a sub-one-second fractional value can never floor to an immediate lock), proven against adversarial drift fixtures
        - fail-closed, bounded-allowlist executable-surface scan (scripts/scan-idle-executable-surface) accepting only the four exact argv forms this service may ever run, and unconditionally rejecting every exec/execDetached/run call regardless of its argument shape - not merely a first-token allowlist
        - hermetic offscreen Quickshell behavior proof (test/security-idle-qml-behavior.sh) driving the real generated Service.qml through startup/probe-absent/probe-present, one-attempt idle-triggered locking, accepted/terminal/transient-failure classification, bounded 3-attempt exhaustion, activity- and stay-awake-cancelled cycles, new-cycle budget reset, the write-serialization coalescing invariant, and IPC enable/disable/toggle/status/debug
        - static ABI contract evidence against the pinned Quickshell IdleMonitor source (respectInhibitors defaults to true, an unsupported protocol warns and leaves isIdle false with no fallback timer, the timeout is converted to milliseconds once, respectInhibitors selects get_idle_notification vs get_input_idle_notification with a protocol-version fallback, a missing seat yields nullptr, and idled/resumed map directly onto isIdle)
        - hermetic omanixy-idle-state adapter test (probe absent/present/indeterminate-on-unsearchable-parent, idempotent set awake/idle, invalid verb/arg/HOME all fail closed to the 0/1/2 ABI only)
        - shell.json and managed-plugin ownership proofs mirroring the Layer-3/5 lock/polkit model exactly, including the reserved omarchy.idle namespace never being revivable via a hand-edited shell.json
        - core+lock-vs-core+lock+idle closure proof at raw store-path granularity: declaredRuntimeInputs is exact-equal (idle adds no package of its own), the compat-bin entry set gains exactly one helper (omanixy-idle-state), and after excluding the exact, named set of Omanixy-owned derivations expected to change identity, every remaining external dependency store path is byte-identical; a separate byte-for-byte comparison proves the Layer-3 lock plugin's own Service.qml is unchanged before/after idle is enabled
        - a markStayAwakeStateUnknown revocation path, proven against the real generated Service.qml, that an indeterminate probe result (exit 2) or a failed-to-start probe/writer Process disables automatic lock-on-idle immediately, cancels any in-flight cycle and armed retry, never infers stayAwake either way, and recovers cleanly once a later probe actually resolves 0 or 1 - including the case where the idle monitor was genuinely idle at the moment trust was lost, which never auto-resumes a stale cycle or reuses an exhausted budget
        - static ABI contract evidence against the pinned Quickshell Process source (src/io/process.{hpp,cpp}) that a normal finish clears the process handle and emits exited() before runningChanged(), that a failed-to-start process emits ONLY runningChanged() and never exited() at all, and that Process exposes a real, parameterless, untracked startDetached()
        - a lock-side FailedToStart path, detected via runningChanged() plus explicit per-operation awaiting-result state and a single Qt.callLater reconciliation (no polling, no invented onError signal), that treats a failed-to-start attempt exactly like IdlePolicy's TRANSIENT_ERROR - bounded to the same 3-attempt budget, never refunded, and proven via a 100-iteration synthetic stress sequence that still caps at exactly 3 actual starts
        - probe- and writer-side FailedToStart paths that revoke trust exactly like an indeterminate exit code, including that a writer failure while persisting either "idle enable" or "idle disable" never leaves automatic lock-on-idle optimistically active from an unconfirmed write, and that exactly one coalesced pending desired-state request (never more, never zero) is attempted after a failed write
        - a fail-closed, bounded-allowlist executable-surface scan (scripts/scan-idle-executable-surface) that additionally, and unconditionally, rejects every Process.startDetached() call regardless of argument shape, including against an already-allowlisted argv, with the same permanent adversarial matrix discipline (comment/string false positives, a real call following fake text) the exec/execDetached/run rejection already has
        - a pinned-backend-derived upper bound (2147483 seconds, the largest whole-second value that survives the pinned Quickshell timeout*1000 signed-32-bit-int conversion) on the configured lock timeout, proven against the real generated IdleModel.js at and past the exact boundary
        - a direct package-level evaluation proof (bypassing programs.omanixy.security.idle and the Home Manager assertion matrix entirely) that packages/omanixy-shell's own idleRequiresLockValid assertion fires for a hand-constructed idle=true/lock=false security attrset, and passes for idle=true/lock=true
      required_before_supported:
        - a real nested Wayland session idle transition against a live ext-idle-notify-v1 compositor, a real Wayland idle inhibitor, real activity cancelling a live cycle, monitor hotplug while idle detection is active, and Quickshell crash/restart during an active idle cycle - investigated at layer 8 and recorded as unsupported-environment in upstream/security-recovery-matrix.yaml (recovery.idle-nested-compositor); Quickshell's IdleMonitor requires the same live Wayland connection that security.lock's own nested-compositor investigation could not establish in this environment. The offscreen fake-monitor behavior proof (test/security-idle-qml-behavior.sh) remains the available evidence for the idle logic itself.
        - the real ext-idle-notify-v1-unsupported fail-safe path against an actual compositor that lacks the protocol - blocked by the same live nested compositor (recovery.idle-nested-compositor)
        - a real declarative conflict scenario (hypridle or swayidle actually running alongside the Quattro idle owner), beyond the already-proven Home Manager assertion matrix - recorded as unsupported-environment in upstream/security-recovery-matrix.yaml (recovery.idle-real-external-owner)
    tests:
      - test/quattro-contract-audit.sh
      - test/security-contracts.sh
      - test/security-idle-hm.sh
      - test/security-idle-shell-json.sh
      - test/security-idle-managed-plugin.sh
      - test/security-idle-model.sh
      - test/security-idle-policy.sh
      - test/security-idle-state.sh
      - test/security-idle-executable-surface.sh
      - test/security-idle-qml-behavior.sh
      - test/security-idle-quickshell-contract.sh
      - test/security-idle-closure.sh
      - test/security-idle-no-dpms-widening.sh
      - test/security-idle-package-invariant.sh
    notes:
      - Layer 6 owns exactly user-session idle detection, inhibitor-aware idle state, bounded lock-on-idle orchestration, user-controlled stay-awake state, and explicit conflict detection with known Home Manager idle managers - it owns none of suspend-on-idle, pre-suspend locking, logind inhibitors, system sleep policy, terminal screensaver presentation, display blanking, DPMS wake policy, keyboard backlight, clamshell policy, or arbitrary external lock providers.
      - programs.omanixy.security.idle.enable is reachable only when programs.omanixy.security.lock.enable is also true; it remains off by default and structurally outside programs.omanixy.features.
      - The pinned Omarchy idle service drives a terminal screensaver (omarchy-launch-screensaver/omarchy-screensaver, ttfx, socat, Hyprland raw-event window tracking) before ever locking; Layer 6 deliberately omits the entire screensaver choreography as an intentional boundary decision, not a TODO - the final adapted service has no screensaver process, timer, tracking, or Hyprland connection of any kind.
      - omarchy-system-lock and omarchy-system-wake are not ported wholesale (keyboard layout reset, 1Password locking, pkill, brightness/clamshell monitor calls); the adapted service's only lock action is the direct argv `omanixy-shell lock lock`, and it never calls any wake/brightness/clamshell helper, since it never blanks the display in the first place.
      - No pre-suspend/sleep-monitor service is added in this layer (omarchy-system-sleep-monitor, omarchy-system-sleep-lock, systemd-inhibit); Layer 8 confirmed final that Omanixy never owns that concern or any claim of suspend safety - intentionally omitted, consumer-owned suspend policy, not a pending gate.
      - security.idle is independent of security.lock.fingerprint and security.polkit.agent: enabling either changes nothing about whether idle may be enabled, proven directly by the Home Manager assertion matrix.
      - No suspend-on-idle, notification-daemon, or recovery ownership is added by this layer.
      - Persisted stay-awake trust is revocable, not merely fail-safe at startup: an indeterminate probe (exit 2) or a probe/writer Process that fails to start disables automatic lock-on-idle immediately via the same stayAwakeStateLoaded=false path startup itself uses, and never infers stayAwake either way - "unknown" is a distinct state from "marker absent", proven at both the exit-code and the FailedToStart-transition level.
      - Cancelling an idle cycle (activity, stay-awake, or a trust revocation) never kills an already-running lock Process; the pinned Layer-3 lock IPC is allowed to complete on its own, and its eventual result is processed normally against whatever state exists by then (a stale ACCEPTED/TERMINAL_UNAVAILABLE is simply a no-op once the cycle has already ended, and a stale retry request is denied by the same cycleActive guard every other retry decision uses) - Layer 6 never sends a signal to, or otherwise interrupts, an in-flight lock request.
      - A lock, probe, or writer Process that fails to start (the pinned Quickshell ABI's onErrorOccurred(QProcess::FailedToStart), which never emits exited()) is detected without polling or an invented QML onError signal: an explicit per-operation awaiting-result flag plus the real runningChanged() signal, reconciled through exactly one Qt.callLater deferral, so a fake or real caller's signal ordering can never cause a normal exit to be double-processed as a start failure.
      - Suspend and resume while an idle cycle or a lock-on-idle request is in flight depends on the same live nested session this layer's own required_before_supported already lists; that specific outstanding case (recovery.suspend-resume) is owned by security.recovery's own required_before_supported entry, not duplicated here.
      - Process.startDetached() is unreachable from the final audited source, even wrapping an otherwise-allowlisted argv (`omanixy-shell lock lock`, or either omanixy-idle-state form) - scan-idle-executable-surface rejects it unconditionally, the same zero-tolerance treatment already given to exec/execDetached/run.
      - The configured lock timeout is bounded above by 2147483 seconds, the largest whole-second value that survives the pinned Quickshell backend's own signed-32-bit-millisecond conversion (`static_cast<int>(timeout * 1000)` in src/wayland/idle_notify/monitor.cpp) - this ceiling is derived from that pinned arithmetic range, not an Omanixy policy preference, and any value past it falls back to the pinned 300-second default exactly like any other invalid input.

  - id: security.notification-daemon
    classification: adapted
