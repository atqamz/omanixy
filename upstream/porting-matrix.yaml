      adapter: omanixy
      backend: host sysfs, UPower, and power-profiles-daemon
    dependencies:
      runtime:
        - jq
        - power-profiles-daemon
        - upower
      host:
        - UPower
        - power-profiles-daemon
    helper:
      - omarchy-battery-status
      - omarchy-powerprofiles-list
      - omarchy-powerprofiles-set
      - omarchy-system-stats
    tests:
      - test/compat-adapters.sh

  - id: monitor.display
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/panels/monitor/Panel.qml
          role: monitor state, brightness, scaling, and text-size consumers
          consumption: runtime
    requirement: Preserve the monitor panel's internal display state and bounded Hyprland and brightness actions.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host Hyprland and brightness device
    dependencies:
      runtime:
        - brightnessctl
        - jq
      host:
        - Hyprland
        - kernel backlight or display brightness device
    helper:
      - omarchy-monitor-state
      - omarchy-brightness-display
      - omarchy-hyprland-monitor-scaling
      - omarchy-display-text-size
    tests:
      - test/compat-adapters.sh
    notes:
      - DDC and hardware-specific external-display behavior is not claimed by the brightness adapter.

  - id: screenshot
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: default/omarchy/omarchy-menu.jsonc
          role: no-argument screenshot action
          consumption: audited-reference
    requirement: Capture a full-screen Wayland screenshot for the supported baseline menu action.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host Wayland
    dependencies:
      runtime:
        - grim
        - wl-clipboard
      host:
        - Wayland
    helper: omarchy-capture-screenshot
    tests:
      - test/safe-menu-contract.sh
    notes:
      - Region, window, OCR, QR, screen recording, editor, and notification workflows are omitted.

  - id: clipboard
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/clipboard/Clipboard.qml
          role: clipboard history action consumers
          consumption: runtime
        - path: shell/plugins/clipboard/capture.sh
          role: clipboard capture process
          consumption: runtime
    requirement: Read the user-owned clipboard history and copy or paste selected text and files through Wayland.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host Wayland clipboard
    dependencies:
      runtime:
        - wl-clipboard
        - wtype
        - jq
        - xdg-utils
      host:
        - Wayland
    helper:
      - omarchy-clipboard-paste-text
      - omarchy-clipboard-paste-file
      - omarchy-clipboard-open
    tests:
      - test/compat-adapters.sh
    notes:
      - The history path remains user-owned under XDG_STATE_HOME.
      - Opening an entry uses xdg-open and does not import Omarchy browser or editor policy.

  - id: emoji
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/emojis/Emojis.qml
