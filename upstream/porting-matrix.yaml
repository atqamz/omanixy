      - test/ipc-wrapper.sh
      - test/runtime-closure.sh
      - test/service-unit.sh
      - test/pin-invariants.sh
    notes:
      - Systemd owns restart, logging, and graphical-session lifecycle.
      - The upstream Bash supervisor is not copied.
      - The compatibility root copies only the audited supported plugin subset and supplies a safe fallback shell configuration.
      - Its registry patch applies the disabled-plugin floor to bar widgets as well as panels and services.
      - Its clock patch routes the unsupported timezone middle-click action to the supported clock panel.

