  - id: launcher.apps
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/services/AppLibrary.qml
          role: desktop entry discovery, launch, and removal
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - DesktopEntries
    requirement: Discover desktop entries, launch them through the session, and remove user-owned launcher entries.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host desktop entries
    dependencies:
      runtime:
        - gtk3
        - desktop-file-utils
      host:
        - user desktop entry database
    helper: omarchy-remove-launcher-entry
    tests:
      - test/compat-adapters.sh
      - test/safe-menu-contract.sh
      - test/launcher-delete-contract.sh
      - test/launcher-cold-launch-vm.nix
    notes:
      - Existing applications use native Quickshell toplevel activation when stable identity yields one target; cold launch uses direct `uwsm app -t service -- gtk-launch` inside the session-scoped app-graphical.slice so gtk-launch can exit without reaping the launched application.
      - Matching uses exact desktop-entry ID or StartupWMClass against Toplevel.appId, with unique case-normalized fallback; ambiguous candidates and title-only matches are rejected.
      - AppLibrary exposes deletion only for a regular desktop file owned by the user's XDG applications directory; system, Nix-store, missing, malformed, symlink, and traversal entries remain unavailable.
      - Menu Delete is reachable for confirmed user-owned entries and inert for every unsupported entry; Omanixy never performs package removal.
      - Removal rejects missing, system-owned, symlink, and traversal targets and does not implement package removal.

  - id: launcher.terminal
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/services/AppLibrarySupport.js
          role: "session-scoped `uwsm app -- gtk-launch` dispatch for desktop entries"
          consumption: runtime
        - path: shell/plugins/menu/BarWidget.qml
          role: "upstream `xdg-terminal-exec` terminal-provider action"
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - DesktopEntries
    requirement: "Launch `Terminal=true` desktop entries through GLib's known `xdg-terminal-exec` handler while preserving the host's terminal choice."
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: XDG Default Terminal Execution and the configured terminal package
    dependencies:
      runtime:
        - xdg-terminal-exec
        - configured terminal emulator
        - gtk3
      host:
        - user terminal choice
        - desktop entry database
    tests:
      - test/launcher-terminal.sh
      - test/launcher-cold-launch-vm.nix
      - test/feature-closure.sh
      - test/feature-lifecycle.sh
    notes:
      - "`programs.omanixy.launcher.terminal.package` defaults to `pkgs.foot` and `programs.omanixy.launcher.terminal.desktop` defaults to `foot.desktop`; consumers may select another terminal package and desktop entry."
      - "Activation seeds `~/.config/xdg-terminals.list` only when the path is absent and no `XDG_CONFIG_DIRS` entry already supplies one, preserving existing regular files and symlinks as user-owned terminal policy."
      - "Launcher-enabled Home Manager profiles include `xdg-terminal-exec` for transient systemd user services; launcher runtimes also retain the pinned helper for the bar's terminal action, while runtimes without launcher omit it with the existing exact compatibility patch."
      - "The cold-launch VM configures the Home Manager module and launches a real `Terminal=true` entry through the transient systemd user service, proving the user-manager PATH resolves the handler; the shell test retains activation ownership and in-process bar terminal coverage."

