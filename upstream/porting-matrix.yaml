        - fail-closed executable-surface scan (scripts/scan-polkit-executable-surface) proving the final generated PolkitAgent.qml has zero Process object instantiations, zero command bindings, and zero exec/execDetached/run calls of any shape - not merely no command bindings, since a bare Process object can execute via .exec(...) with no command property at all
        - hermetic offscreen Quickshell behavior proof (test/security-polkit-qml-behavior.sh) covering inactive/waiting/response-required/submit/cancel/failure/success/daemon-cancellation states against a deterministic fake agent
        - static ABI contract evidence against the pinned Quickshell polkit service source (one registration attempt per construction, no retry on registration failure, ordinary failure restarts a fresh session, destruction drains queued requests and cancels the active flow, and unregisters only through the listener helper's own null-checked, self-clearing handle)
        - known declarative agent-conflict assertions (services.hyprpolkitagent.enable, services.polkit-gnome.enable) proven via a 12-case Home Manager x NixOS evaluation matrix
        - shell.json and managed-plugin ownership proofs mirroring the Layer-3 lock model exactly
        - core-only closure proof at raw store-path granularity: declaredRuntimeInputs and the compat-bin entry set are byte-identical, and after excluding the exact, named set of Omanixy-owned derivations expected to change identity because the compatibility root's contents differ, every remaining external dependency store path is byte-identical (not merely same-named)
      required_before_promotion:
        - real, nested D-Bus polkit agent registration success against a live polkitd - the pinned Quickshell ABI proof (test/security-polkit-quickshell-contract.sh) and the offscreen fake-agent behavior proof (test/security-polkit-qml-behavior.sh) are both hermetic and cover the declarative known-conflict and bounded-registration-failure invariants already, but neither exercises a real D-Bus session
        - real collision with a second, independently managed session polkit agent already registered at runtime (not the declarative hyprpolkitagent/polkit-gnome conflict assertions, which are already proven)
        - real polkit authentication success against actual polkit-agent-helper/PAM
        - real wrong-password/authentication-failure behavior against the real backend
        - real user cancellation and real daemon-initiated cancellation against a live session
        - polkitd disappearance/reappearance while a request is in flight
        - Quickshell crash/restart during an active authentication request
        - repeated-backend-failure/log-volume behavior under real, sustained failure conditions
        - nested session validation (a real Wayland/Hyprland session, not an offscreen fixture)
    tests:
      - test/quattro-contract-audit.sh
      - test/security-contracts.sh
      - test/security-polkit-system.sh
      - test/security-polkit-hm.sh
      - test/security-polkit-shell-json.sh
      - test/security-polkit-managed-plugin.sh
      - test/security-polkit-core-only.sh
      - test/security-polkit-closure.sh
      - test/security-polkit-executable-surface.sh
      - test/security-polkit-model.sh
      - test/security-polkit-qml-behavior.sh
      - test/security-polkit-quickshell-contract.sh
      - test/security-polkit-no-fingerprint-widening.sh
    notes:
      - Omanixy does not enable the polkit system capability or the Quattro agent, install a competing agent, or write PAM configuration in layer 1.
      - Layer 5 makes the native Quattro polkit agent reachable only when both programs.omanixy.security.polkit.system.enable (NixOS) and programs.omanixy.security.polkit.agent.enable (Home Manager) are explicitly set to true; both remain off by default and structurally outside programs.omanixy.features.
      - The pinned Omarchy PolkitAgent.qml infers fingerprint availability by parsing /etc/pam.d/polkit-1 and checks a laptop-lid helper before showing a fingerprint-specific presentation; Layer 5 deliberately removes both. The adapted presentation is authentication-method-neutral, driven only by the pinned Quickshell AuthFlow.isResponseRequired signal, and never assumes fingerprint hardware.
      - security.lock and security.polkit-agent are fully independent: enabling one never implies or requires the other, proven directly by the Home Manager assertion matrix.
      - experimental, not supported, because every proof in this layer is hermetic and fake-backend: no live D-Bus registration, no real polkit authentication success or wrong-password behavior against actual polkit-agent-helper/PAM, no daemon disappearance/reappearance, and no nested-session validation has been exercised. These remain the ledger's required_before_promotion items for this entry, deferred to the Layer 8 recovery/support gate.
      - No polkit-agent restart loop is added on top of the pinned Quickshell ABI's own ordinary-failure-restarts-a-fresh-session behavior; unknown external agent registration failure remains finite and diagnostic, never resolved by killing or disabling anything.
      - No idle manager or notification daemon is enabled by this layer.

  - id: security.idle
    classification: adapted
    support: experimental
    maturity: audited
    owner: atqamz/omanixy#4
    planned_stack_layer: 6/8
    promoted_at_layer: 6/8
    audit_layer: 1/8
    target:
      classification: adapted
      support: experimental
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/plugins/services/idle/
          role: idle detection service (Service.qml/IdleModel.js) - only idle detection, inhibitor-aware idle state, and bounded lock-on-idle orchestration are ported; the terminal screensaver path, pre-suspend locking, and DPMS/wake ownership are all deliberately not ported (see notes)
          consumption: audited-reference
        - path: bin/omarchy-launch-screensaver
          role: screensaver launch contract, deliberately not ported - Layer 6 has no screensaver process/timer/tracking of any kind
          consumption: audited-reference
        - path: bin/omarchy-system-lock
          role: lock action contract, deliberately not ported - the adapted service calls the Layer-3 native lock IPC (`omanixy-shell lock lock`) directly instead
          consumption: audited-reference
        - path: bin/omarchy-system-wake
          role: wake/DPMS action contract, deliberately not ported - Layer 6 never blanks the display, so it has nothing of its own to wake
          consumption: audited-reference
        - path: bin/omarchy-system-sleep-monitor
          role: pre-sleep inhibitor/lock contract, deliberately not ported in this layer - deferred to Layer 8's suspend/resume gate
          consumption: audited-reference
        - path: bin/omarchy-system-sleep-lock
          role: pre-sleep lock contract, deliberately not ported in this layer - deferred to Layer 8's suspend/resume gate
          consumption: audited-reference
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - Quickshell.Wayland (IdleMonitor, backed by ext-idle-notify-v1)
    requirement: Provide bounded user-session idle detection with an explicit owner, respecting Wayland inhibitors, that only ever requests the native lock and never owns suspend, DPMS, or the terminal screensaver.
    ownership:
      presentation: omarchy
      adapter: "issue #4"
      system: consumer host suspend, DPMS/display-blanking, and power policy - Layer 6 owns none of it
      session: "Quickshell IdleMonitor detects idle -> the Layer-6 service decides when to request a lock -> Layer 3's native lock owns WlSessionLock+DPMS -> consumer/NixOS owns suspend/power policy -> Layer 8 owns suspend/resume/recovery"
    helpers:
      - omanixy-idle-state
    filesystem:
      - ~/.local/state/omarchy/indicators/stay-awake
    failure_sensitive:
      - respectInhibitors must default to true and never be disabled
      - lock-on-idle must fail closed (no lock request) without security.lock.enable
      - an unsupported ext-idle-notify-v1 protocol must warn and leave isIdle false, never invent a fallback timer
      - lock retries are bounded to 3 actual Process starts per idle cycle and never repeat indefinitely
      - a terminal lock-unavailable result (missing-pam/failed) must never be retried or reinterpreted as success
      - activity or stay-awake must cancel an in-flight lock-on-idle cycle immediately, with no attempt resuming on its own
    evidence:
      available:
        - declarative programs.omanixy.security.idle.enable Home Manager option, disabled by default, structurally independent of programs.omanixy.security.lock.fingerprint and programs.omanixy.security.polkit.agent, with a resolved-state assertion requiring programs.omanixy.security.lock.enable=true and known-conflict assertions against services.hypridle.enable/services.swayidle.enable
        - pure decision-logic module (packages/omanixy-shell/IdlePolicy.js) for the bounded lock-retry policy, driven directly (not reimplemented) by both the real generated Service.qml and a 100-iteration Node.js stress test covering exhaustion, terminal failures, activity/stay-awake cancellation, and new-cycle budget resets
        - exact-source, fail-on-drift patcher (scripts/patch-idle-service) removing the pinned screensaver/Hyprland/system-lock/system-wake code and hardening the lock-timeout parser (floor-then-positive-check, so a sub-one-second fractional value can never floor to an immediate lock), proven against adversarial drift fixtures
        - fail-closed, bounded-allowlist executable-surface scan (scripts/scan-idle-executable-surface) accepting only the four exact argv forms this service may ever run, and unconditionally rejecting every exec/execDetached/run call regardless of its argument shape - not merely a first-token allowlist
        - hermetic offscreen Quickshell behavior proof (test/security-idle-qml-behavior.sh) driving the real generated Service.qml through startup/probe-absent/probe-present, one-attempt idle-triggered locking, accepted/terminal/transient-failure classification, bounded 3-attempt exhaustion, activity- and stay-awake-cancelled cycles, new-cycle budget reset, the write-serialization coalescing invariant, and IPC enable/disable/toggle/status/debug
        - static ABI contract evidence against the pinned Quickshell IdleMonitor source (respectInhibitors defaults to true, an unsupported protocol warns and leaves isIdle false with no fallback timer, the timeout is converted to milliseconds once, respectInhibitors selects get_idle_notification vs get_input_idle_notification with a protocol-version fallback, a missing seat yields nullptr, and idled/resumed map directly onto isIdle)
        - hermetic omanixy-idle-state adapter test (probe absent/present/indeterminate-on-unsearchable-parent, idempotent set awake/idle, invalid verb/arg/HOME all fail closed to the 0/1/2 ABI only)
        - shell.json and managed-plugin ownership proofs mirroring the Layer-3/5 lock/polkit model exactly, including the reserved omarchy.idle namespace never being revivable via a hand-edited shell.json
        - core+lock-vs-core+lock+idle closure proof at raw store-path granularity: declaredRuntimeInputs is exact-equal (idle adds no package of its own), the compat-bin entry set gains exactly one helper (omanixy-idle-state), and after excluding the exact, named set of Omanixy-owned derivations expected to change identity, every remaining external dependency store path is byte-identical; a separate byte-for-byte comparison proves the Layer-3 lock plugin's own Service.qml is unchanged before/after idle is enabled
      required_before_promotion:
        - a real nested Wayland session idle transition against a live ext-idle-notify-v1 compositor - the pinned ABI proof (test/security-idle-quickshell-contract.sh) and the offscreen fake-monitor behavior proof (test/security-idle-qml-behavior.sh) are both hermetic and cover the declarative and bounded-retry invariants already, but neither exercises a real compositor
        - a real Wayland idle inhibitor actually suppressing the idle transition
        - real activity ending a live idle cycle and cancelling an in-flight lock-on-idle request against a live session
        - monitor hotplug/seat change while idle detection is active
        - suspend and resume while an idle cycle or a lock-on-idle request is in flight (deferred to Layer 8, which owns suspend/resume/recovery)
        - Quickshell crash/restart during an active idle cycle
        - the real ext-idle-notify-v1-unsupported fail-safe path against an actual compositor that lacks the protocol
        - a real declarative conflict scenario (hypridle or swayidle actually running alongside the Quattro idle owner), beyond the already-proven Home Manager assertion matrix
    tests:
      - test/quattro-contract-audit.sh
      - test/security-contracts.sh
      - test/security-idle-hm.sh
      - test/security-idle-shell-json.sh
      - test/security-idle-managed-plugin.sh
      - test/security-idle-model.sh
      - test/security-idle-policy.sh
      - test/security-idle-state.sh
      - test/security-idle-executable-surface.sh
      - test/security-idle-qml-behavior.sh
      - test/security-idle-quickshell-contract.sh
      - test/security-idle-closure.sh
      - test/security-idle-no-dpms-widening.sh
    notes:
      - Layer 6 owns exactly user-session idle detection, inhibitor-aware idle state, bounded lock-on-idle orchestration, user-controlled stay-awake state, and explicit conflict detection with known Home Manager idle managers - it owns none of suspend-on-idle, pre-suspend locking, logind inhibitors, system sleep policy, terminal screensaver presentation, display blanking, DPMS wake policy, keyboard backlight, clamshell policy, or arbitrary external lock providers.
      - programs.omanixy.security.idle.enable is reachable only when programs.omanixy.security.lock.enable is also true; it remains off by default and structurally outside programs.omanixy.features.
      - The pinned Omarchy idle service drives a terminal screensaver (omarchy-launch-screensaver/omarchy-screensaver, ttfx, socat, Hyprland raw-event window tracking) before ever locking; Layer 6 deliberately omits the entire screensaver choreography as an intentional boundary decision, not a TODO - the final adapted service has no screensaver process, timer, tracking, or Hyprland connection of any kind.
      - omarchy-system-lock and omarchy-system-wake are not ported wholesale (keyboard layout reset, 1Password locking, pkill, brightness/clamshell monitor calls); the adapted service's only lock action is the direct argv `omanixy-shell lock lock`, and it never calls any wake/brightness/clamshell helper, since it never blanks the display in the first place.
      - No pre-suspend/sleep-monitor service is added in this layer (omarchy-system-sleep-monitor, omarchy-system-sleep-lock, systemd-inhibit); that entire concern, including any claim of suspend safety, is deferred to Layer 8.
      - security.idle is independent of security.lock.fingerprint and security.polkit.agent: enabling either changes nothing about whether idle may be enabled, proven directly by the Home Manager assertion matrix.
      - No suspend-on-idle, notification-daemon, or recovery ownership is added by this layer.

