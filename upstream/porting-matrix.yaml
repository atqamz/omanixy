  - id: launcher.apps
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/services/AppLibrary.qml
          role: desktop entry discovery, launch, and removal
          consumption: runtime
    native_quickshell:
      project: quickshell-mirror/quickshell
      revision: 28771c7c74b42e20afca0b1b63980cb46515537c
      modules:
        - DesktopEntries
    requirement: Discover desktop entries, launch them through the session, and remove user-owned launcher entries.
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host desktop entries
    dependencies:
      runtime:
        - gtk3
        - desktop-file-utils
      host:
        - user desktop entry database
    helper: omarchy-remove-launcher-entry
    tests:
      - test/compat-adapters.sh
      - test/safe-menu-contract.sh
      - test/launcher-delete-contract.sh
    notes:
      - Launching uses the pinned UWSM client and gtk-launch inside the session-scoped app-graphical.slice.
      - AppLibrary exposes deletion only for a regular desktop file owned by the user's XDG applications directory; system, Nix-store, missing, malformed, symlink, and traversal entries remain unavailable.
      - Menu Delete is reachable for confirmed user-owned entries and inert for every unsupported entry; Omanixy never performs package removal.
      - Removal rejects missing, system-owned, symlink, and traversal targets and does not implement package removal.

  - id: menu.baseline
