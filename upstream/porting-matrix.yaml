items:
  - id: shell.runtime
    classification: adapted
    maturity: validated
    upstream:
      project: basecamp/omarchy
      revision: f0020448ca87329199de7cb12f2015ebc4a3e5e7
      paths:
        - path: shell/shell.qml
          role: runtime entrypoint
          consumption: runtime
        - path: shell/Commons/
          role: shared Quattro presentation components
          consumption: runtime
        - path: shell/Ui/
          role: shared Quattro presentation components
          consumption: runtime
        - path: shell/services/
          role: runtime services and app discovery
          consumption: runtime
        - path: shell/plugins/
          role: audited supported first-party plugin subset
          consumption: runtime
        - path: config/omarchy/shell.json
          role: upstream default configuration input for user-state migration
          consumption: reference-and-migration
        - path: themes/tokyo-night/
          role: Tokyo Night source for the baseline theme seed
          consumption: build-time
        - path: bin/omarchy-launch-shell
          role: upstream reference only
          consumption: reference-only
    ownership:
      presentation: omarchy
      adapter: omanixy
      backend: host session
    dependencies:
      runtime:
        - quickshell
      host:
        - Wayland
        - Hyprland
        - D-Bus user session
    tests:
      - test/config-ownership.sh
      - test/ipc-wrapper.sh
      - test/runtime-closure.sh
      - test/service-unit.sh
      - test/pin-invariants.sh
    notes:
      - Systemd owns restart, logging, and graphical-session lifecycle.
      - The upstream Bash supervisor is not copied.
      - The compatibility root copies only the audited supported plugin subset and supplies a safe fallback shell configuration.
      - Its registry patch applies the disabled-plugin floor to bar widgets as well as panels and services.
      - Its clock patch routes the unsupported timezone middle-click action to the supported clock panel.

